<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mock Test - TN Warriors</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-403SNE66JG"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-403SNE66JG');
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.timer-box {
    background: #dc2626;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    min-width: 100px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.test-header {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.test-title {
    margin: 0 0 8px;
    font-size: 25px;
}

.test-info {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.6;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 18px;
}

.question-card,
.sidebar {
    background: white;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.question-number {
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 12px;
}

.question-text {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.question-image {
    display: block;
    max-width: 100%;
    max-height: 420px;
    width: auto;
    height: auto;
    object-fit: contain;
    margin: 12px 0 20px;
    border-radius: 8px;
}

.option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: background .2s, border-color .2s;
    overflow-wrap: anywhere;
}

.option:hover {
    background: #f3f4f6;
}

.option.selected {
    border-color: #2563eb;
    background: #eff6ff;
}

.option input {
    margin: 4px 0 0;
    flex: 0 0 auto;
}

.option-content {
    flex: 1;
    min-width: 0;
}

.option-label {
    font-weight: bold;
    margin-bottom: 6px;
}

.option-text {
    font-size: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.option-image {
    display: block;
    max-width: 100%;
    width: auto;
    height: auto;
    max-height: 300px;
    object-fit: contain;
    margin-top: 10px;
    border-radius: 6px;
}

.image-loading {
    color: #6b7280;
    font-size: 13px;
    margin-top: 8px;
}

.navigation {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 22px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.prev-btn {
    background: #e5e7eb;
    color: #111827;
}

.next-btn {
    background: #2563eb;
    color: white;
}

.submit-btn {
    background: #16a34a;
    color: white;
}

.mark-btn {
    background: #f59e0b;
    color: #111827;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.sidebar {
    height: fit-content;
}

.sidebar h3 {
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.q-btn {
    padding: 9px 0;
    border-radius: 6px;
    background: #e5e7eb;
    color: #111827;
}

.q-btn.answered {
    background: #2563eb;
    color: white;
}

.q-btn.marked {
    background: #f59e0b;
    color: #111827;
}

.q-btn.current {
    outline: 3px solid #111827;
}

.status-box {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #e5e7eb;
    font-size: 14px;
    line-height: 1.8;
}

.loading,
.error {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    overflow-wrap: anywhere;
}

.error {
    color: #b91c1c;
}

@media (max-width: 800px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        order: -1;
    }

    .header-inner {
        flex-direction: column;
        align-items: stretch;
    }

    .timer-box {
        width: 100%;
    }

    .question-text {
        font-size: 16px;
    }
}

@media (max-width: 500px) {
    .container {
        padding: 0 10px;
    }

    .question-card,
    .sidebar {
        padding: 16px;
    }

    .navigation button {
        flex: 1;
        min-width: 110px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">TN Warriors</div>
        <div class="timer-box">
            <span id="timer">00:00</span>
        </div>
    </div>
</header>

<div class="container">

    <div id="loadingBox" class="loading">
        Loading mock test...
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <div id="testContent" style="display:none;">

        <div class="test-header">
            <h1 id="testTitle" class="test-title"></h1>
            <div id="testInfo" class="test-info"></div>
        </div>

        <div class="layout">

            <main class="question-card">

                <div id="questionNumber" class="question-number"></div>

                <div id="questionText" class="question-text"></div>

                <div id="questionImageContainer"></div>

                <div id="optionsContainer"></div>

                <div class="navigation">
                    <button id="prevBtn" class="prev-btn">Previous</button>
                    <button id="markBtn" class="mark-btn">Mark for Review</button>
                    <button id="nextBtn" class="next-btn">Next</button>
                    <button id="submitBtn" class="submit-btn">Submit Test</button>
                </div>

            </main>

            <aside class="sidebar">

                <h3>Questions</h3>

                <div id="questionGrid" class="grid"></div>

                <div class="status-box">
                    <div>Answered: <strong id="answeredCount">0</strong></div>
                    <div>Marked: <strong id="markedCount">0</strong></div>
                    <div>Unanswered: <strong id="unansweredCount">0</strong></div>
                </div>

            </aside>

        </div>
    </div>
</div>

<script>
"use strict";

/* --------------------------------
   SUPABASE CONFIGURATION
-------------------------------- */

const SUPABASE_URL =
    "https://nwipyqarobgelksdbkbq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";

const IMAGE_BUCKET =
    "tn-warriors-question-images";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const params =
    new URLSearchParams(window.location.search);

const testId =
    params.get("id");

const storageKey =
    "tnwarriors_mock_test_" + testId;

let testData = null;
let questions = [];
let currentIndex = 0;
let selectedAnswers = {};
let markedQuestions = new Set();
let remainingSeconds = 0;
let timerInterval = null;
let hasSubmitted = false;
let progressDeadline = null;

/* --------------------------------
   DOM ELEMENTS
-------------------------------- */

const loadingBox = document.getElementById("loadingBox");
const errorBox = document.getElementById("errorBox");
const testContent = document.getElementById("testContent");
const testTitle = document.getElementById("testTitle");
const testInfo = document.getElementById("testInfo");
const timerElement = document.getElementById("timer");
const questionNumber = document.getElementById("questionNumber");
const questionText = document.getElementById("questionText");
const questionImageContainer = document.getElementById("questionImageContainer");
const optionsContainer = document.getElementById("optionsContainer");
const questionGrid = document.getElementById("questionGrid");
const answeredCount = document.getElementById("answeredCount");
const markedCount = document.getElementById("markedCount");
const unansweredCount = document.getElementById("unansweredCount");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const markBtn = document.getElementById("markBtn");
const submitBtn = document.getElementById("submitBtn");

/* --------------------------------
   ERROR HANDLING
-------------------------------- */

function showError(message) {
    clearInterval(timerInterval);
    loadingBox.style.display = "none";
    testContent.style.display = "none";
    errorBox.style.display = "block";
    errorBox.textContent = message;
}

/* --------------------------------
   SAFE TEXT
-------------------------------- */

function formatTime(seconds) {
    seconds = Math.max(0, Number(seconds) || 0);

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;

    return String(minutes).padStart(2, "0") +
        ":" + String(secs).padStart(2, "0");
}

/* --------------------------------
   STORAGE SIGNED URLS

   Image paths are stored in
   mock_questions table.

   Bucket is private, so create
   temporary signed URLs.
-------------------------------- */

async function getImageUrl(path) {
    if (!path || typeof path !== "string") {
        return null;
    }

    const cleanPath = path.trim();

    if (!cleanPath) {
        return null;
    }

    // Allow full URLs if a previous version
    // of the admin page stored them.
    if (/^https?:\/\//i.test(cleanPath)) {
        return cleanPath;
    }

    const normalizedPath =
        cleanPath.replace(/^\/+/, "");

    const { data, error } =
        await supabaseClient.storage
            .from(IMAGE_BUCKET)
            .createSignedUrl(normalizedPath, 3600);

    if (error) {
        console.error(
            "Unable to create image URL:",
            normalizedPath,
            error
        );
        return null;
    }

    return data?.signedUrl || null;
}

/* --------------------------------
   PREPARE IMAGE URLS
-------------------------------- */

async function prepareQuestionImages() {
    const imageTasks = questions.map(async question => {
        question._optionImageUrls = {};

        const imageColumns = {
            A: question.option_a_image_path,
            B: question.option_b_image_path,
            C: question.option_c_image_path,
            D: question.option_d_image_path
        };

        for (const key of ["A", "B", "C", "D"]) {
            const path = imageColumns[key];

            if (!path) {
                question._optionImageUrls[key] = null;
                continue;
            }

            question._optionImageUrls[key] =
                await getImageUrl(path);
        }

        // Also support question images if the
        // question_image_path column exists.
        question._questionImageUrl =
            question.question_image_path
                ? await getImageUrl(question.question_image_path)
                : null;
    });

    await Promise.all(imageTasks);
}

/* --------------------------------
   SAVE PROGRESS
-------------------------------- */

function saveProgress() {
    if (!testId || hasSubmitted) return;

    const progress = {
        testId,
        currentIndex,
        selectedAnswers,
        markedQuestions: Array.from(markedQuestions),
        remainingSeconds,
        savedAt: new Date().toISOString()
    };

    try {
        localStorage.setItem(
            storageKey,
            JSON.stringify(progress)
        );
    } catch (error) {
        console.error("Unable to save progress:", error);
    }
}

/* --------------------------------
   LOAD PROGRESS
-------------------------------- */

function loadProgress() {
    try {
        const saved = localStorage.getItem(storageKey);

        if (!saved) return;

        const progress = JSON.parse(saved);

        if (!progress || progress.testId !== testId) {
            return;
        }

        selectedAnswers =
            progress.selectedAnswers || {};

        markedQuestions =
            new Set(progress.markedQuestions || []);

        if (
            Number.isInteger(progress.currentIndex) &&
            progress.currentIndex >= 0 &&
            progress.currentIndex < questions.length
        ) {
            currentIndex = progress.currentIndex;
        }

        if (Number.isFinite(Number(progress.remainingSeconds))) {
            remainingSeconds =
                Number(progress.remainingSeconds);
        }
    } catch (error) {
        console.error("Progress load error:", error);
    }
}

/* --------------------------------
   LOAD TEST
-------------------------------- */

async function loadTest() {
    if (!testId) {
        showError("Mock test ID is missing from the URL.");
        return;
    }

    try {
        const {
            data: test,
            error: testError
        } = await supabaseClient
            .from("mock_tests")
            .select(`
                id,
                title,
                exam_name,
                duration_minutes,
                total_questions,
                total_marks,
                negative_mark,
                description,
                is_published
            `)
            .eq("id", testId)
            .eq("is_published", true)
            .single();

        if (testError) throw testError;

        if (!test) {
            throw new Error(
                "Mock test not found or not published."
            );
        }

        testData = test;

        const {
            data: questionData,
            error: questionError
        } = await supabaseClient
            .from("mock_questions")
            .select(`
                id,
                mock_test_id,
                question_text,
                question_image_path,
                option_a,
                option_b,
                option_c,
                option_d,
                option_a_image_path,
                option_b_image_path,
                option_c_image_path,
                option_d_image_path,
                marks,
                question_order
            `)
            .eq("mock_test_id", testId)
            .order("question_order", { ascending: true });

        if (questionError) throw questionError;

        questions = questionData || [];

        if (!questions.length) {
            throw new Error(
                "No questions found for this mock test."
            );
        }

        testTitle.textContent = test.title || "Mock Test";

        testInfo.textContent =
            (test.exam_name || "Mock Test") +
            " • " + questions.length + " Questions" +
            " • " + test.duration_minutes + " Minutes" +
            " • " + test.total_marks + " Marks";

        remainingSeconds =
            Number(test.duration_minutes || 0) * 60;

        if (remainingSeconds <= 0) {
            throw new Error("Invalid test duration.");
        }

        loadProgress();

        // Generate temporary URLs for private images.
        await prepareQuestionImages();

        loadingBox.style.display = "none";
        errorBox.style.display = "none";
        testContent.style.display = "block";

        renderQuestion();
        renderQuestionGrid();
        updateCounts();
        updateTimer();
        startTimer();
        saveProgress();

    } catch (error) {
        console.error("Mock test loading error:", error);

        showError(
            "Unable to load mock test: " +
            (error.message || "Unknown error")
        );
    }
}

/* --------------------------------
   RENDER QUESTION IMAGE
-------------------------------- */

function renderQuestionImage(question) {
    questionImageContainer.innerHTML = "";

    if (!question._questionImageUrl) {
        return;
    }

    const image = document.createElement("img");

    image.className = "question-image";
    image.src = question._questionImageUrl;
    image.alt = "Question image";
    image.loading = "lazy";

    image.onerror = function() {
        this.style.display = "none";
    };

    questionImageContainer.appendChild(image);
}

/* --------------------------------
   RENDER QUESTION
-------------------------------- */

function renderQuestion() {
    if (!questions.length) return;

    const question = questions[currentIndex];

    questionNumber.textContent =
        "Question " + (currentIndex + 1) +
        " of " + questions.length;

    questionText.textContent =
        question.question_text || "";

    renderQuestionImage(question);

    optionsContainer.innerHTML = "";

    const options = [
        {
            key: "A",
            text: question.option_a,
            image: question._optionImageUrls?.A
        },
        {
            key: "B",
            text: question.option_b,
            image: question._optionImageUrls?.B
        },
        {
            key: "C",
            text: question.option_c,
            image: question._optionImageUrls?.C
        },
        {
            key: "D",
            text: question.option_d,
            image: question._optionImageUrls?.D
        }
    ];

    options.forEach(option => {
        const label = document.createElement("label");
        label.className = "option";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = "question";
        input.value = option.key;

        if (
            selectedAnswers[question.id] === option.key
        ) {
            input.checked = true;
            label.classList.add("selected");
        }

        input.addEventListener("change", function() {
            if (hasSubmitted) return;

            selectedAnswers[question.id] = option.key;

            optionsContainer
                .querySelectorAll(".option")
                .forEach(item => {
                    item.classList.remove("selected");
                });

            label.classList.add("selected");

            saveProgress();
            renderQuestionGrid();
            updateCounts();
        });

        label.appendChild(input);

        const content = document.createElement("div");
        content.className = "option-content";

        const optionLabel = document.createElement("div");
        optionLabel.className = "option-label";
        optionLabel.textContent = option.key + ".";

        content.appendChild(optionLabel);

        if (option.text) {
            const text = document.createElement("div");
            text.className = "option-text";
            text.textContent = option.text;
            content.appendChild(text);
        }

        if (option.image) {
            const image = document.createElement("img");

            image.className = "option-image";
            image.src = option.image;
            image.alt = "Option " + option.key + " image";
            image.loading = "lazy";

            image.onerror = function() {
                this.style.display = "none";
                console.error(
                    "Unable to display option image:",
                    option.key
                );
            };

            content.appendChild(image);
        }

        label.appendChild(content);
        optionsContainer.appendChild(label);
    });

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === questions.length - 1;

    markBtn.textContent =
        markedQuestions.has(question.id)
            ? "Remove Review Mark"
            : "Mark for Review";
}

/* --------------------------------
   QUESTION GRID
-------------------------------- */

function renderQuestionGrid() {
    questionGrid.innerHTML = "";

    questions.forEach((question, index) => {
        const button = document.createElement("button");

        button.className = "q-btn";
        button.textContent = index + 1;
        button.type = "button";

        if (selectedAnswers[question.id]) {
            button.classList.add("answered");
        }

        if (markedQuestions.has(question.id)) {
            button.classList.add("marked");
        }

        if (index === currentIndex) {
            button.classList.add("current");
        }

        button.addEventListener("click", function() {
            if (hasSubmitted) return;

            currentIndex = index;

            renderQuestion();
            renderQuestionGrid();
            saveProgress();
        });

        questionGrid.appendChild(button);
    });
}

/* --------------------------------
   ANSWER COUNTS
-------------------------------- */

function updateCounts() {
    const answered = questions.filter(
        question => Boolean(selectedAnswers[question.id])
    ).length;

    const marked = markedQuestions.size;
    const unanswered = Math.max(0, questions.length - answered);

    answeredCount.textContent = answered;
    markedCount.textContent = marked;
    unansweredCount.textContent = unanswered;
}

/* --------------------------------
   TIMER
-------------------------------- */

function updateTimer() {
    timerElement.textContent =
        formatTime(remainingSeconds);

    if (remainingSeconds <= 60) {
        timerElement.style.background = "#991b1b";
    }
}

function startTimer() {
    clearInterval(timerInterval);

    if (remainingSeconds <= 0) {
        submitTest(true);
        return;
    }

    timerInterval = setInterval(function() {
        if (hasSubmitted) {
            clearInterval(timerInterval);
            return;
        }

        remainingSeconds--;
        updateTimer();
        saveProgress();

        if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            submitTest(true);
        }
    }, 1000);
}

/* --------------------------------
   PREVIOUS / NEXT
-------------------------------- */

prevBtn.addEventListener("click", function() {
    if (hasSubmitted || currentIndex <= 0) return;

    currentIndex--;
    renderQuestion();
    renderQuestionGrid();
    saveProgress();
});

nextBtn.addEventListener("click", function() {
    if (
        hasSubmitted ||
        currentIndex >= questions.length - 1
    ) return;

    currentIndex++;
    renderQuestion();
    renderQuestionGrid();
    saveProgress();
});

/* --------------------------------
   MARK FOR REVIEW
-------------------------------- */

markBtn.addEventListener("click", function() {
    if (hasSubmitted) return;

    const question = questions[currentIndex];

    if (markedQuestions.has(question.id)) {
        markedQuestions.delete(question.id);
    } else {
        markedQuestions.add(question.id);
    }

    renderQuestion();
    renderQuestionGrid();
    updateCounts();
    saveProgress();
});

/* --------------------------------
   SUBMIT BUTTON
-------------------------------- */

submitBtn.addEventListener("click", function() {
    if (hasSubmitted) return;

    const answered = questions.filter(
        question => Boolean(selectedAnswers[question.id])
    ).length;

    const unanswered = questions.length - answered;

    const confirmed = window.confirm(
        "Are you sure you want to submit the test?\n\n" +
        "Answered: " + answered + "\n" +
        "Unanswered: " + unanswered + "\n\n" +
        "Continue to submit?"
    );

    if (!confirmed) return;

    submitTest(false);
});

/* --------------------------------
   FINAL SUBMISSION
-------------------------------- */

function submitTest(isAutoSubmit) {
    if (hasSubmitted) return;

    hasSubmitted = true;

    clearInterval(timerInterval);

    submitBtn.disabled = true;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    markBtn.disabled = true;

    const totalDurationSeconds =
        Number(testData?.duration_minutes || 0) * 60;

    const timeTakenSeconds = Math.max(
        0,
        Math.min(
            totalDurationSeconds,
            totalDurationSeconds - remainingSeconds
        )
    );

    const submissionData = {
        testId,
        answers: selectedAnswers,
        markedQuestions: Array.from(markedQuestions),
        autoSubmitted: Boolean(isAutoSubmit),
        time_taken_seconds: timeTakenSeconds,
        submittedAt: new Date().toISOString()
    };

    try {
        localStorage.setItem(
            storageKey + "_submission",
            JSON.stringify(submissionData)
        );

        localStorage.removeItem(storageKey);
    } catch (error) {
        console.error("Unable to save submission:", error);
    }

    window.location.href =
        "mock-test-result.html?id=" +
        encodeURIComponent(testId);
}

/* --------------------------------
   START
-------------------------------- */

loadTest();

</script>

</body>
</html>
