<script>


/* =====================================================
   CONFIGURATION
   ===================================================== */


const SUPABASE_URL =
    "https://nwipyqarobgelksdbkbk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const SUBMIT_FUNCTION_URL =
    SUPABASE_URL +
    "/functions/v1/submit-mock-test";


/*
   RESULT VALIDITY
   20 MINUTES
*/

const RESULT_DURATION =
    20 * 60;


/*
   AD WAIT TIME
   5 SECONDS
*/

const AD_DURATION =
    5;


/* =====================================================
   DOM
   ===================================================== */


const resultContainer =
    document.getElementById(
        "resultContainer"
    );


const adOverlay =
    document.getElementById(
        "adOverlay"
    );


const adCountdown =
    document.getElementById(
        "adCountdown"
    );


const skipAdButton =
    document.getElementById(
        "skipAdButton"
    );


/* =====================================================
   URL
   ===================================================== */


const params =
    new URLSearchParams(
        window.location.search
    );


const testId =
    params.get("id");


/* =====================================================
   STORAGE KEYS
   ===================================================== */


const submissionKey =
    "tnwarriors_mock_test_" +
    testId +
    "_submission";


const temporaryResultKey =
    "tnwarriors_mock_test_" +
    testId +
    "_temporary_result";


const progressKey =
    "tnwarriors_mock_test_" +
    testId;


/* =====================================================
   GLOBAL DATA
   ===================================================== */


let submission = null;

let resultData = null;

let questions = [];

let expiryTimer = null;

let adTimer = null;


/* =====================================================
   INITIAL LOAD
   ===================================================== */


initializeResult();


async function initializeResult() {

    if (!testId) {

        showError(
            "Mock test ID is missing."
        );

        return;

    }


    try {

        /*
           FIRST:
           Check temporary result
        */

        const storedResult =
            localStorage.getItem(
                temporaryResultKey
            );


        if (storedResult) {

            const parsed =
                JSON.parse(
                    storedResult
                );


            if (
                parsed &&
                parsed.expiresAt &&
                Date.now() <
                parsed.expiresAt
            ) {

                resultData =
                    parsed.result;


                submission =
                    getSubmission();


                await loadQuestions();

                renderResult();

                startExpiryTimer(
                    parsed.expiresAt
                );

                return;

            }


            localStorage.removeItem(
                temporaryResultKey
            );

        }


        /*
           SECOND:
           Get submission
        */

        submission =
            getSubmission();


        if (!submission) {

            showError(
                "Your mock test submission could not be found. Please take the test again."
            );

            return;

        }


        /*
           THIRD:
           Check 20 minute expiry
        */

        const submittedAt =
            new Date(
                submission.submittedAt
            ).getTime();


        const expiresAt =
            submittedAt +
            (
                RESULT_DURATION *
                1000
            );


        if (
            Date.now() >=
            expiresAt
        ) {

            expireResult();

            return;

        }


        /*
           FOURTH:
           Calculate result
        */

        await calculateResult(
            expiresAt
        );

    } catch (error) {

        console.error(
            "Result initialization error:",
            error
        );


        showError(
            error.message ||
            "Unable to calculate result."
        );

    }

}


/* =====================================================
   GET SUBMISSION
   ===================================================== */


function getSubmission() {

    const stored =
        localStorage.getItem(
            submissionKey
        );


    if (!stored) {
        return null;
    }


    try {

        return JSON.parse(
            stored
        );

    } catch (error) {

        console.error(
            "Submission parse error:",
            error
        );

        return null;

    }

}


/* =====================================================
   CALCULATE RESULT
   ===================================================== */


async function calculateResult(
    expiresAt
) {

    resultContainer.innerHTML = `

        <div class="loading">

            Calculating your result...

        </div>

    `;


    const response =
        await fetch(
            SUBMIT_FUNCTION_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        test_id:
                            testId,

                        answers:
                            submission.answers ||
                            {}

                    })

            }
        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data.error ||
            "Unable to calculate result."
        );

    }


    resultData =
        data.result;


    /*
       Save temporary result
       for 20 minutes.
    */

    localStorage.setItem(
        temporaryResultKey,

        JSON.stringify({

            result:
                resultData,

            expiresAt:
                expiresAt

        })
    );


    await loadQuestions();


    renderResult();


    startExpiryTimer(
        expiresAt
    );

}


/* =====================================================
   LOAD QUESTIONS
   ===================================================== */


async function loadQuestions() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("mock_questions")
            .select(`
                id,
                question_text,
                option_a,
                option_b,
                option_c,
                option_d,
                marks,
                question_order
            `)
            .eq(
                "mock_test_id",
                testId
            )
            .order(
                "question_order",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Question loading error:",
            error
        );

        questions = [];

        return;

    }


    questions =
        data || [];

}


/* =====================================================
   RENDER RESULT
   ===================================================== */


function renderResult() {

    if (!resultData) {

        showError(
            "Result data is unavailable."
        );

        return;

    }


    const correct =
        Number(
            resultData.correct_count ||
            0
        );


    const wrong =
        Number(
            resultData.wrong_count ||
            0
        );


    const skipped =
        Number(
            resultData.skipped_count ||
            0
        );


    const score =
        Number(
            resultData.score ||
            0
        );


    const maximumMarks =
        Number(
            resultData.maximumMarks ||
            0
        );


    const percentage =
        Number(
            resultData.percentage ||
            0
        );


    const timeTaken =
        Number(
            submission &&
            submission.time_taken_seconds ||
            0
        );


    resultContainer.innerHTML = `

        <h1 class="test-title">

            ${escapeHTML(
                resultData.title ||
                "Mock Test Result"
            )}

        </h1>


        <div class="exam-name">

            ${escapeHTML(
                resultData.exam_name ||
                ""
            )}

        </div>


        <div
            id="expiryBox"
            class="expiry-box"
        >

            Result available for:
            <span id="resultCountdown">
                20:00
            </span>

        </div>


        <div class="score-box">

            <div class="score">

                ${score.toFixed(2)}
                /
                ${maximumMarks.toFixed(2)}

            </div>


            <div class="percentage">

                ${percentage.toFixed(2)}%

            </div>

        </div>


        <div class="stats-grid">


            <div class="stat">

                <span class="stat-value">
                    ${correct}
                </span>

                <span class="stat-label">
                    Correct
                </span>

            </div>


            <div class="stat">

                <span class="stat-value">
                    ${wrong}
                </span>

                <span class="stat-label">
                    Wrong
                </span>

            </div>


            <div class="stat">

                <span class="stat-value">
                    ${skipped}
                </span>

                <span class="stat-label">
                    Skipped
                </span>

            </div>


            <div class="stat">

                <span class="stat-value">

                    ${formatTime(
                        timeTaken
                    )}

                </span>

                <span class="stat-label">
                    Time Taken
                </span>

            </div>


        </div>


        <div class="note">

            Download your result PDF before the
            <strong>20-minute result timer</strong>
            expires.

        </div>


        <section
            class="review-section"
        >

            <h2>
                Detailed Review
            </h2>


            <div id="reviewList">

                ${renderReview()}

            </div>

        </section>


        <div class="button-area">


            <button
                id="downloadPdfButton"
                class="button pdf-button"
            >

                Download Result PDF

            </button>


            <button
                id="retryButton"
                class="button primary"
            >

                Take Test Again

            </button>


            <a
                href="mock-tests.html"
                class="button secondary"
            >

                Back to Mock Tests

            </a>


        </div>


        <div class="footer-note">

            This result is temporary and will
            expire after 20 minutes.

        </div>

    `;


    document
        .getElementById(
            "downloadPdfButton"
        )
        .addEventListener(
            "click",
            openAdvertisement
        );


    document
        .getElementById(
            "retryButton"
        )
        .addEventListener(
            "click",
            retryTest
        );

}


/* =====================================================
   REVIEW
   ===================================================== */


function renderReview() {

    const review =
        resultData.review || [];


    if (
        review.length === 0
    ) {

        return `

            <div class="note">

                Detailed review is not available.

            </div>

        `;

    }


    return review
        .map(
            (
                item,
                index
            ) => {

                const question =
                    questions.find(
                        q =>
                            q.id ===
                            item.question_id
                    );


                const questionText =
                    question
                        ? question.question_text
                        : "Question";


                const options = {

                    A:
                        question
                            ? question.option_a
                            : "",

                    B:
                        question
                            ? question.option_b
                            : "",

                    C:
                        question
                            ? question.option_c
                            : "",

                    D:
                        question
                            ? question.option_d
                            : ""

                };


                const selected =
                    item.selected_option
                        ? String(
                            item.selected_option
                        ).toUpperCase()
                        : null;


                const correct =
                    item.correct_option
                        ? String(
                            item.correct_option
                        ).toUpperCase()
                        : null;


                let statusText =
                    "Skipped";


                let statusClass =
                    "skipped";


                if (
                    item.result ===
                    "correct"
                ) {

                    statusText =
                        "Correct";

                    statusClass =
                        "correct";

                }


                if (
                    item.result ===
                    "wrong"
                ) {

                    statusText =
                        "Wrong";

                    statusClass =
                        "wrong";

                }


                const selectedText =
                    selected
                        ? (
                            options[selected] ||
                            selected
                        )
                        : "Not answered";


                const correctText =
                    correct
                        ? (
                            options[correct] ||
                            correct
                        )
                        : "Not available";


                let answerClass =
                    "your-answer";


                if (
                    item.result ===
                    "wrong"
                ) {

                    answerClass =
                        "wrong-answer";

                }


                if (
                    item.result ===
                    "skipped"
                ) {

                    answerClass =
                        "skipped-answer";

                }


                return `

                    <div class="review-card">


                        <div class="review-header">

                            <span
                                class="question-number"
                            >

                                Question
                                ${index + 1}

                            </span>


                            <span
                                class="status ${statusClass}"
                            >

                                ${statusText}

                            </span>

                        </div>


                        <div class="question-text">

                            ${escapeHTML(
                                questionText
                            )}

                        </div>


                        <div
                            class="answer-row ${answerClass}"
                        >

                            <strong>
                                Your Answer:
                            </strong>

                            ${
                                selected
                                    ? (
                                        selected +
                                        ". " +
                                        escapeHTML(
                                            selectedText
                                        )
                                    )
                                    : "Not answered"
                            }

                        </div>


                        ${
                            correct
                                ? `

                                    <div
                                        class="answer-row correct-answer"
                                    >

                                        <strong>
                                            Correct Answer:
                                        </strong>

                                        ${correct}.
                                        ${escapeHTML(
                                            correctText
                                        )}

                                    </div>

                                `
                                : ""
                        }


                        ${
                            item.explanation
                                ? `

                                    <div
                                        class="explanation"
                                    >

                                        <strong>
                                            Explanation:
                                        </strong>

                                        <br><br>

                                        ${escapeHTML(
                                            item.explanation
                                        )}

                                    </div>

                                `
                                : ""
                        }


                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   RESULT COUNTDOWN
   ===================================================== */


function startExpiryTimer(
    expiresAt
) {

    if (expiryTimer) {

        clearInterval(
            expiryTimer
        );

    }


    function updateTimer() {

        const remaining =
            Math.max(
                0,
                expiresAt -
                Date.now()
            );


        const seconds =
            Math.floor(
                remaining /
                1000
            );


        const minutes =
            Math.floor(
                seconds /
                60
            );


        const finalSeconds =
            seconds %
            60;


        const countdown =
            document.getElementById(
                "resultCountdown"
            );


        if (countdown) {

            countdown.textContent =
                String(minutes)
                    .padStart(
                        2,
                        "0"
                    ) +
                ":" +
                String(finalSeconds)
                    .padStart(
                        2,
                        "0"
                    );

        }


        if (
            remaining <= 0
        ) {

            clearInterval(
                expiryTimer
            );

            expireResult();

        }

    }


    updateTimer();


    expiryTimer =
        setInterval(
            updateTimer,
            1000
        );

}


/* =====================================================
   EXPIRE RESULT
   ===================================================== */


function expireResult() {

    if (expiryTimer) {

        clearInterval(
            expiryTimer
        );

    }


    localStorage.removeItem(
        temporaryResultKey
    );


    localStorage.removeItem(
        submissionKey
    );


    localStorage.removeItem(
        progressKey
    );


    resultContainer.innerHTML = `

        <div class="expired-box">


            <h2>
                Result Expired
            </h2>


            <p>

                Your 20-minute result viewing
                period has ended.

            </p>


            <p>

                You can take the mock test again
                to generate a new result.

            </p>


            <div class="button-area">


                <a
                    href="mock-tests.html"
                    class="button secondary"
                >

                    Back to Mock Tests

                </a>

            </div>


        </div>

    `;

}


/* =====================================================
   ADVERTISEMENT FLOW
   ===================================================== */


function openAdvertisement() {

    if (!resultData) {
        return;
    }


    adOverlay.classList.add(
        "show"
    );


    skipAdButton.disabled =
        true;


    skipAdButton.textContent =
        "Please wait...";


    let remaining =
        AD_DURATION;


    adCountdown.textContent =
        "Download available in " +
        remaining +
        " seconds";


    if (adTimer) {

        clearInterval(
            adTimer
        );

    }


    adTimer =
        setInterval(
            function () {

                remaining--;


                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        adTimer
                    );


                    adCountdown.textContent =
                        "You can download your PDF now.";


                    skipAdButton.disabled =
                        false;


                    skipAdButton.textContent =
                        "Skip Ad & Download PDF";


                    return;

                }


                adCountdown.textContent =
                    "Download available in " +
                    remaining +
                    " seconds";

            },
            1000
        );

}


/* =====================================================
   SKIP AD / DOWNLOAD
   ===================================================== */


skipAdButton.addEventListener(
    "click",
    async function () {

        if (
            skipAdButton.disabled
        ) {

            return;

        }


        skipAdButton.disabled =
            true;


        skipAdButton.textContent =
            "Creating PDF...";


        try {

            await generatePDF();


            adOverlay.classList.remove(
                "show"
            );


            skipAdButton.disabled =
                false;


            skipAdButton.textContent =
                "Skip Ad & Download PDF";

        } catch (error) {

            console.error(
                "PDF generation error:",
                error
            );


            alert(
                "Unable to create PDF. Please try again."
            );


            skipAdButton.disabled =
                false;


            skipAdButton.textContent =
                "Skip Ad & Download PDF";

        }

    }
);


/* =====================================================
   GENERATE PDF
   ===================================================== */


async function generatePDF() {

    const {
        jsPDF
    } =
        window.jspdf;


    const doc =
        new jsPDF();


    const title =
        resultData.title ||
        "TN Warriors Mock Test";


    const exam =
        resultData.exam_name ||
        "";


    const score =
        Number(
            resultData.score ||
            0
        );


    const maximumMarks =
        Number(
            resultData.maximumMarks ||
            0
        );


    const percentage =
        Number(
            resultData.percentage ||
            0
        );


    const correct =
        Number(
            resultData.correct_count ||
            0
        );


    const wrong =
        Number(
            resultData.wrong_count ||
            0
        );


    const skipped =
        Number(
            resultData.skipped_count ||
            0
        );


    const timeTaken =
        Number(
            submission &&
            submission.time_taken_seconds ||
            0
        );


    let y =
        20;


    doc.setFontSize(
        22
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.text(
        "TN Warriors",
        105,
        y,
        {
            align: "center"
        }
    );


    y += 12;


    doc.setFontSize(
        16
    );


    doc.text(
        "Mock Test Result",
        105,
        y,
        {
            align: "center"
        }
    );


    y += 12;


    doc.setFontSize(
        13
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.text(
        title,
        105,
        y,
        {
            align: "center"
        }
    );


    y += 8;


    doc.text(
        exam,
        105,
        y,
        {
            align: "center"
        }
    );


    y += 15;


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.text(
        "Result Summary",
        14,
        y
    );


    y += 5;


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.autoTable({

        startY:
            y + 2,

        head: [
            [
                "Score",
                "Percentage",
                "Correct",
                "Wrong",
                "Skipped",
                "Time Taken"
            ]
        ],

        body: [
            [
                score.toFixed(2) +
                    " / " +
                    maximumMarks.toFixed(2),

                percentage.toFixed(2) +
                    "%",

                String(correct),

                String(wrong),

                String(skipped),

                formatTime(
                    timeTaken
                )

            ]
        ],

        theme:
            "grid",

        styles: {

            fontSize: 9,

            cellPadding: 4

        }

    });


    y =
        doc.lastAutoTable.finalY +
        15;


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(
        14
    );


    doc.text(
        "Detailed Review",
        14,
        y
    );


    y += 5;


    const review =
        resultData.review || [];


    const tableRows =
        review.map(
            (
                item,
                index
            ) => {

                const question =
                    questions.find(
                        q =>
                            q.id ===
                            item.question_id
                    );


                const options = {

                    A:
                        question
                            ? question.option_a
                            : "",

                    B:
                        question
                            ? question.option_b
                            : "",

                    C:
                        question
                            ? question.option_c
                            : "",

                    D:
                        question
                            ? question.option_d
                            : ""

                };


                const selected =
                    item.selected_option
                        ? String(
                            item.selected_option
                        ).toUpperCase()
                        : null;


                const correctOption =
                    item.correct_option
                        ? String(
                            item.correct_option
                        ).toUpperCase()
                        : null;


                const selectedText =
                    selected
                        ? (
                            selected +
                            ". " +
                            (
                                options[selected] ||
                                ""
                            )
                        )
                        : "Not answered";


                const correctText =
                    correctOption
                        ? (
                            correctOption +
                            ". " +
                            (
                                options[correctOption] ||
                                ""
                            )
                        )
                        : "Not available";


                const status =
                    item.result ===
                    "correct"
                        ? "Correct"
                        : item.result ===
                          "wrong"
                            ? "Wrong"
                            : "Skipped";


                return [

                    "Q" +
                    (index + 1),

                    question
                        ? question.question_text
                        : "Question",

                    selectedText,

                    correctText,

                    status,

                    item.explanation ||
                        ""

                ];

            }
        );


    doc.autoTable({

        startY:
            y + 2,

        head: [[

            "Q",

            "Question",

            "Your Answer",

            "Correct Answer",

            "Status",

            "Explanation"

        ]],

        body:
            tableRows,

        theme:
            "grid",

        styles: {

            fontSize: 7,

            cellPadding: 3,

            valign:
                "top"

        },

        headStyles: {

            fontStyle:
                "bold"

        },

        columnStyles: {

            0: {
                cellWidth: 10
            },

            1: {
                cellWidth: 42
            },

            2: {
                cellWidth: 32
            },

            3: {
                cellWidth: 32
            },

            4: {
                cellWidth: 17
            },

            5: {
                cellWidth: 50
            }

        },

        margin: {

            left: 10,

            right: 10

        }

    });


    const safeTitle =
        title
            .replace(
                /[^a-z0-9]/gi,
                "-"
            )
            .replace(
                /-+/g,
                "-"
            )
            .replace(
                /^-|-$/g,
                ""
            );


    const fileName =
        (
            safeTitle ||
            "TN-Warriors-Mock-Test"
        ) +
        "-Result.pdf";


    doc.save(
        fileName
    );

}


/* =====================================================
   RETRY
   ===================================================== */


function retryTest() {

    localStorage.removeItem(
        submissionKey
    );


    localStorage.removeItem(
        temporaryResultKey
    );


    localStorage.removeItem(
        progressKey
    );


    window.location.href =
        "mock-test.html?id=" +
        encodeURIComponent(
            testId
        );

}


/* =====================================================
   ERROR
   ===================================================== */


function showError(
    message
) {

    resultContainer.innerHTML = `

        <div class="error-box">

            <strong>
                Unable to calculate result
            </strong>

            <br><br>

            ${escapeHTML(
                message
            )}

            <div class="button-area">

                <a
                    href="mock-tests.html"
                    class="button secondary"
                >

                    Back to Mock Tests

                </a>

            </div>

        </div>

    `;

}


/* =====================================================
   FORMAT TIME
   ===================================================== */


function formatTime(
    totalSeconds
) {

    const seconds =
        Math.max(
            0,
            Number(
                totalSeconds ||
                0
            )
        );


    const minutes =
        Math.floor(
            seconds /
            60
        );


    const remaining =
        seconds %
        60;


    return (
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":" +
        String(remaining)
            .padStart(
                2,
                "0"
            )
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */


function escapeHTML(
    value
) {

    return String(
        value ??
        ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
