    <style>

        * {

        body {

        main {

            max-width: 900px;

            margin: auto;

            padding: 35px 15px 60px;

        }


        .back-button {

            display: inline-block;

            background: #101827;

            color: white;

            text-decoration: none;

            padding: 10px 15px;

            border-radius: 7px;

            margin-bottom: 25px;

        }


        .details-card {

            background: white;

            border-radius: 14px;

            padding: 28px;

            box-shadow:
                0 5px 18px

        }


        .details-card h2 {

            margin-top: 0;

            color: #245bd8;

            font-size: 28px;

            line-height: 1.3;

        }


        .status {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 5px;

            background: #d4edda;

            color: #155724;

            font-weight: bold;

            margin-bottom: 20px;

        }


        .featured {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 5px;

            background: #fff3cd;

            color: #856404;

            font-size: 13px;

            margin-left: 5px;

            margin-bottom: 20px;

        }


        .section {

            margin-top: 28px;

            padding-top: 20px;

            border-top: 1px solid #e1e4e8;

        }


        .section h3 {

            margin-top: 0;

        .info-row {

            display: grid;

            grid-template-columns:
                190px 1fr;

            gap: 15px;

            border-bottom:

        .info-value {

        .description {

        .button-group {

            display: flex;

        }


        .button {

            display: inline-block;

            text-decoration: none;

            text-align: center;

            padding: 12px 18px;

            border-radius: 7px;

        }


        .notification-button {

        .apply-button {

        .materials-button {

        .loading {

            background: white;

        .error {

        footer {

            .logo {
                font-size: 26px;

            nav {

            .details-card {
                padding: 20px;
            }


            .details-card h2 {
                font-size: 24px;
            }


            .info-row {

                grid-template-columns: 1fr;

                gap: 5px;

            }


            .button {

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            TN WARRIORS
        </div>

        <div class="tagline">
            Jobs • Exams • Defence Updates • Study Materials
        </div>

    </header>


    <!-- NAVIGATION -->

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="jobs.html">
            Jobs
        </a>

        <a href="exams.html">
            Exams
        </a>

        <a href="defence.html">
            Defence
        </a>

    </nav>


    <!-- HERO -->

    <section class="hero">

        <h1>
            Exam Details
        </h1>

        <p>
            Complete examination information and preparation resources.
        </p>

    </section>


    <!-- MAIN -->

    <main>

        <a
            href="exams.html"
            class="back-button"
            id="backButton"
        >
            ← Back to Exams
        </a>


        <div id="examDetails">

            <div class="loading">
                Loading exam details...
            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 TN Warriors. All Rights Reserved.

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        /* =========================================
           SUPABASE
        ========================================= */

        const SUPABASE_URL =
            "https://nwipyqarobgelksdbkbk.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           GET EXAM ID
        ========================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const examId =
            params.get("id");


        const examDetails =
            document.getElementById(
                "examDetails"
            );


        const backButton =
            document.getElementById(
                "backButton"
            );


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================
           SAFE URL
        ========================================= */

        function safeURL(url) {

            if (!url) {

                return "";

            }


            try {

                const parsed =
                    new URL(url);


                if (
                    parsed.protocol ===
                    "http:" ||

                    parsed.protocol ===
                    "https:"
                ) {

                    return parsed.href;

                }


            } catch (error) {

                return "";

            }


            return "";

        }


        /* =========================================
           FORMAT DATE
        ========================================= */

        function formatDate(dateValue) {

            if (!dateValue) {

                return "-";

            }


            const date =
                new Date(dateValue);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return escapeHtml(
                    dateValue
                );

            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

        }


        /* =========================================
           LOAD EXAM
        ========================================= */

        async function loadExam() {

            if (!examId) {

                examDetails.innerHTML = `

                    <div class="error">

                        Exam ID is missing.

                        <br><br>

                        Please open the exam
                        from the Exams page.

                    </div>

                `;

                return;

            }


            try {

                const {
                    data: exam,
                    error
                } =
                    await supabaseClient

                        .from("exams")

                        .select(`
                            id,
                            slug,
                            title,
                            organization,
                            description,
                            qualification,
                            syllabus,
                            exam_date,
                            notification_url,
                            apply_url,
                            status,
                            is_published,
                            is_featured,
                            category,
                            created_at
                        `)

                        .eq(
                            "id",
                            examId
                        )

                        .eq(
                            "is_published",
                            true
                        )

                        .single();


                if (error) {

                    throw error;

                }


                if (!exam) {

                    throw new Error(
                        "Exam not found."
                    );

                }


                renderExam(
                    exam
                );


            } catch (error) {

                console.error(
                    "Exam details error:",
                    error
                );


                examDetails.innerHTML = `

                    <div class="error">

                        <strong>
                            Unable to load exam details.
                        </strong>

                        <br><br>

                        ${escapeHtml(
                            error.message ||
                            "Exam not found."
                        )}

                        <br><br>

                        Please go back and
                        select an exam again.

                    </div>

                `;

            }

        }


        /* =========================================
           RENDER EXAM
        ========================================= */

        function renderExam(exam) {

            document.title =
                "TN Warriors - " +
                (
                    exam.title ||
                    "Exam Details"
                );


            const notificationURL =
                safeURL(
                    exam.notification_url
                );


            const applyURL =
                safeURL(
                    exam.apply_url
                );


            const materialsURL =
                "study-materials.html?exam=" +
                encodeURIComponent(
                    exam.id
                );


            examDetails.innerHTML = `

                <article
                    class="details-card"
                >

                    <h2>
                        ${escapeHtml(
                            exam.title ||
                            "Untitled Exam"
                        )}
                    </h2>


                    ${
                        exam.status
                        ? `
                            <span class="status">
                                ${escapeHtml(
                                    exam.status
                                )}
                            </span>
                        `
                        : ""
                    }


                    ${
                        exam.is_featured
                        ? `
                            <span class="featured">
                                Featured
                            </span>
                        `
                        : ""
                    }


                    ${
                        exam.description
                        ? `

                            <div class="section">

                                <h3>
                                    About the Exam
                                </h3>

                                <div
                                    class="description"
                                >

                                    ${escapeHtml(
                                        exam.description
                                    )}

                                </div>

                            </div>

                        `
                        : ""
                    }


                    <div class="section">

                        <h3>
                            Exam Information
                        </h3>


                        <div class="info-row">

                            <div
                                class="info-label"
                            >
                                Organization
                            </div>

                            <div
                                class="info-value"
                            >
                                ${escapeHtml(
                                    exam.organization ||
                                    "-"
                                )}
                            </div>

                        </div>


                        <div class="info-row">

                            <div
                                class="info-label"
                            >
                                Category
                            </div>

                            <div
                                class="info-value"
                            >
                                ${escapeHtml(
                                    (
                                        exam.category ||
                                        "-"
                                    ).toUpperCase()
                                )}
                            </div>

                        </div>


                        <div class="info-row">

                            <div
                                class="info-label"
                            >
                                Qualification
                            </div>

                            <div
                                class="info-value"
                            >
                                ${escapeHtml(
                                    exam.qualification ||
                                    "-"
                                )}
                            </div>

                        </div>


                        <div class="info-row">

                            <div
                                class="info-label"
                            >
                                Exam Date
                            </div>

                            <div
                                class="info-value"
                            >
                                ${formatDate(
                                    exam.exam_date
                                )}
                            </div>

                        </div>


                        <div class="info-row">

                            <div
                                class="info-label"
                            >
                                Status
                            </div>

                            <div
                                class="info-value"
                            >
                                ${escapeHtml(
                                    exam.status ||
                                    "-"
                                )}
                            </div>

                        </div>

                    </div>


                    ${
                        exam.syllabus
                        ? `

                            <div class="section">

                                <h3>
                                    Syllabus
                                </h3>

                                <div
                                    class="syllabus"
                                >

                                    ${escapeHtml(
                                        exam.syllabus
                                    )}

                                </div>

                            </div>

                        `
                        : ""
                    }


                    <div class="section">
                                            <h3>
                            Official Links
                        </h3>


                        <div
                            class="button-group"
                        >

                            ${
                                notificationURL
                                ? `

                                    <a
                                        href="${escapeHtml(
                                            notificationURL
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="button notification-button"
                                    >
                                        Official Notification
                                    </a>

                                `
                                : ""
                            }


                            ${
                                applyURL
                                ? `

                                    <a
                                        href="${escapeHtml(
                                            applyURL
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="button apply-button"
                                    >
                                        Official Apply Link
                                    </a>

                                `
                                : ""
                            }


                            <a
                                href="${materialsURL}"
                                class="button materials-button"
                            >
                                Study Materials
                            </a>

                        </div>

                    </div>

                </article>

            `;

        }


        /* =========================================
           START
        ========================================= */

        loadExam();

    </script>


</body>

</html>
