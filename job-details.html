    <style>

        body {

        .loading {

        .error-box {

        footer {

        @media (max-width: 600px) {

                font-size: 23px;
            }

            .details-table td {
                display: block;

            .details-table td:first-child {

            .details-table td:last-child {

        }

<body>


<header>

    <h1>TN WARRIORS</h1>

    <p>Jobs • Exams • Defence Updates</p>

</header>


<nav>

    <a href="index.html">Home</a>

    <a href="jobs.html">Jobs</a>

    <a href="exams.html">Exams</a>

    <a href="defence.html">Defence</a>

</nav>


<div class="container">

    <div id="jobContainer">

        <div class="loading">
            Loading job details...
        </div>

    </div>

</div>


<footer>

    <p>
        © 2026 TN Warriors. All Rights Reserved.
    </p>

</footer>


<script>

    /* ================================
       SUPABASE
       ================================ */

    const SUPABASE_URL =
        "https://nwipyqarobgelksdbkbk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* ================================
       SECURITY
       ================================ */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function safeURL(url) {

        if (!url) {
            return "";
        }

        try {

            const parsed =
                new URL(url);

            if (
                parsed.protocol === "http:" ||
                parsed.protocol === "https:"
            ) {
                return parsed.href;
            }

        } catch (error) {

            return "";

        }

        return "";
    }


    /* ================================
       DATE FORMAT
       ================================ */

    function formatDate(value) {

        if (!value) {
            return "Not specified";
        }

        const date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {
            return "Not specified";
        }

        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
    }


    /* ================================
       GET JOB ID
       ================================ */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const jobId =
        params.get("id");


    /* ================================
       LOAD JOB
       ================================ */

    async function loadJob() {

        const container =
            document.getElementById(
                "jobContainer"
            );


        if (!jobId) {

            container.innerHTML = `
                <div class="error-box">

                    Job not found.

                    <br><br>

                    <a
                        class="button back-button"
                        href="jobs.html"
                    >
                        Back to Jobs
                    </a>

                </div>
            `;

            return;

        }


        try {

            const {
                data: job,
                error
            } = await supabaseClient

                .from("jobs")

                .select(`
                    id,
                    title,
                    slug,
                    department,
                    description,
                    vacancies,
                    qualification,
                    age_limit,
                    salary,
                    application_fee,
                    start_date,
                    last_date,
                    exam_date,
                    notification_url,
                    apply_url,
                    status,
                    is_published,
                    is_featured,
                    created_at
                `)

                .eq(
                    "id",
                    jobId
                )

                .eq(
                    "is_published",
                    true
                )

                .neq(
                    "status",
                    "archived"
                )

                .single();


            if (error) {
                throw error;
            }


            if (!job) {
                throw new Error(
                    "Job not found."
                );
            }


            renderJob(job);


        } catch (error) {

            console.error(
                "Job loading error:",
                error
            );

            container.innerHTML = `
                <div class="error-box">

                    Unable to load this job.

                    <br><br>

                    The job may have been removed
                    or is no longer published.

                    <br><br>

                    <a
                        class="button back-button"
                        href="jobs.html"
                    >
                        Back to Jobs
                    </a>

                </div>
            `;

        }

    }


    /* ================================
       RENDER JOB
       ================================ */

    function renderJob(job) {

        const container =
            document.getElementById(
                "jobContainer"
            );


        const title =
            escapeHTML(
                job.title
            );

        const department =
            escapeHTML(
                job.department
            );

        const description =
            escapeHTML(
                job.description
            );

        const vacancies =
            escapeHTML(
                job.vacancies
            );

        const qualification =
            escapeHTML(
                job.qualification
            );

        const ageLimit =
            escapeHTML(
                job.age_limit
            );

        const salary =
            escapeHTML(
                job.salary
            );

        const applicationFee =
            escapeHTML(
                job.application_fee
            );

        const status =
            escapeHTML(
                job.status || "Open"
            );


        const notificationURL =
            safeURL(
                job.notification_url
            );

        const applyURL =
            safeURL(
                job.apply_url
            );


        container.innerHTML = `

            <article class="job-details">

                <h2>
                    ${title}
                </h2>


                <div>

                    <span class="status">
                        ${status}
                    </span>


                    ${
                        job.is_featured
                        ?
                        `
                        <span class="featured">
                            Featured
                        </span>
                        `
                        :
                        ""
                    }

                </div>


                ${
                    description
                    ?
                    `
                    <div class="description">
                        ${description}
                    </div>
                    `
                    :
                    ""
                }


                <table class="details-table">

                    ${
                        department
                        ?
                        `
                        <tr>
                            <td>
                                Department
                            </td>
                            <td>
                                ${department}
                            </td>
                        </tr>
                        `
                        :
                        ""
                    }


                    ${
                        vacancies
                        ?
                        `
                        <tr>
                            <td>
                                Vacancies
                            </td>
                            <td>
                                ${vacancies}
                            </td>
                        </tr>
                        `
                        :
                        ""
                    }


                    ${
                        qualification
                        ?
                        `
                        <tr>
                            <td>
                                Qualification
                            </td>
                            <td>
                                ${qualification}
                            </td>
                        </tr>
                        `
                        :
                        ""
                    }


                    ${
                        ageLimit
                        ?
                        `
                        <tr>
                            <td>
                                Age Limit
                            </td>
                            <td>
                                ${ageLimit}
                            </td>
                        </tr>
                        `
                        :
                        ""
                    }


                    ${
                        salary
                        ?
                        `
                        <tr>
                            <td>
                                Salary
                            </td>
                            <td>
                                ${salary}
                            </td>
                        </tr>
                        `
                        :
                        ""
                    }


                    ${
                        applicationFee
                        ?
                        `
                        <tr>
                            <td>
                                Application Fee
                            </td>
                            <td>
                                ${applicationFee}
                            </td>
                        </tr>
                        `
                        :
                        ""
                    }


                    <tr>
                        <td>
                            Application Start
                        </td>
                        <td>
                            ${formatDate(
                                job.start_date
                            )}
                        </td>
                    </tr>


                    <tr>
                        <td>
                            Last Date
                        </td>
                        <td>
                            ${formatDate(
                                job.last_date
                            )}
                        </td>
                    </tr>


                    ${
                        job.exam_date
                        ?
                        `
                        <tr>
                            <td>
                                Exam Date
                            </td>
                            <td>
                                ${formatDate(
                                    job.exam_date
                                )}
                            </td>
                        </tr>
                        `
                        :
                        ""
                    }

                </table>


                <div class="actions">

                    ${
                        applyURL
                        ?
                        `
                        <a
                            class="button apply-button"
                            href="${applyURL}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Apply Now
                        </a>
                        `
                        :
                        ""
                    }


                    ${
                        notificationURL
                        ?
                        `
                        <a
                            class="button notification-button"
                            href="${notificationURL}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Official Notification
                        </a>
                        `
                        :
                        ""
                    }


                    <a
                        class="button back-button"
                        href="jobs.html"
                    >
                        Back to Jobs
                    </a>

                </div>

            </article>

        `;

    }


    /* ================================
       START
       ================================ */

    loadJob();

</script>


</body>
