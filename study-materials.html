<body>

<main>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    /*
     * SUPABASE CONFIG
     */

    const SUPABASE_URL =
        "https://nwipyqarobgelksdbkbk.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    /*
     * ELEMENTS
     */

    const materialsContainer =
        document.getElementById(
            "materialsContainer"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );



    /*
     * URL PARAMETERS
     */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const category =
        urlParams.get("category");


    const examId =
        urlParams.get("exam");



    /*
     * ESCAPE HTML
     */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    /*
     * LOAD MATERIALS
     */

    async function loadMaterials() {

        materialsContainer.innerHTML = `

            <div class="status-box">

                Loading study materials...

            </div>

        `;


        try {

            let query =
                supabaseClient
                    .from(
                        "study_materials"
                    )
                    .select(`
                        id,
                        slug,
                        title,
                        description,
                        exam_id,
                        exam_name,
                        subject,
                        year,
                        part,
                        file_path,
                        file_size_bytes,
                        file_type,
                        is_premium,
                        is_published,
                        sort_order,
                        created_at
                    `)
                    .eq(
                        "is_published",
                        true
                    )
                    .order(
                        "sort_order",
                        {
                            ascending: true
                        }
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            /*
             * FILTER BY EXAM
             */

            if (examId) {

                query =
                    query.eq(
                        "exam_id",
                        examId
                    );

            }


            const {
                data,
                error
            } = await query;


            if (error) {

                console.error(
                    "Study materials error:",
                    error
                );

                throw error;

            }


            window.allMaterials =
                data || [];


            renderMaterials();

        }

        catch (error) {

            console.error(
                "Loading error:",
                error
            );


            materialsContainer.innerHTML = `

                <div class="status-box error">

                    <h3>
                        Unable to load study materials
                    </h3>

                    <p>
                        ${escapeHTML(
                            error.message ||
                            "Unknown error"
                        )}
                    </p>

                </div>

            `;

        }

    }



    /*
     * RENDER MATERIALS
     */

    function renderMaterials() {

        const materials =
            window.allMaterials || [];


        const searchTerm =
            searchInput.value
                .trim()
                .toLowerCase();


        const filteredMaterials =
            materials.filter(
                function(material) {

                    if (!searchTerm) {

                        return true;

                    }


                    const searchableText = [

                        material.title,

                        material.description,

                        material.exam_name,

                        material.subject,

                        material.year,

                        material.part

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return searchableText.includes(
                        searchTerm
                    );

                }
            );



        if (
            filteredMaterials.length === 0
        ) {

            materialsContainer.innerHTML = `

                <div class="status-box">

                    <h3>
                        No study materials found
                    </h3>

                    <p>
                        Try another search or check back later.
                    </p>

                </div>

            `;

            return;

        }



        const cards =
            filteredMaterials
                .map(
                    function(material) {


                        const premium =
                            material.is_premium === true;


                        const description =
                            material.description ||
                            "Study material for exam preparation.";


                        const examName =
                            material.exam_name ||
                            "General";


                        const subject =
                            material.subject ||
                            "Not specified";


                        const year =
                            material.year ||
                            "Not specified";


                        const part =
                            material.part ||
                            "Not specified";


                        const fileType =
                            material.file_type ||
                            "PDF";



                        return `

                            <article
                                class="material-card"
                            >

                                <h3>
                                    ${escapeHTML(
                                        material.title
                                    )}
                                </h3>


                                <div
                                    class="badge-row"
                                >

                                    <span
                                        class="badge ${
                                            premium
                                                ? "premium-badge"
                                                : "free-badge"
                                        }"
                                    >

                                        ${
                                            premium
                                                ? "Premium"
                                                : "Free"
                                        }

                                    </span>


                                    <span
                                        class="badge type-badge"
                                    >

                                        ${escapeHTML(
                                            fileType
                                        )}

                                    </span>

                                </div>



                                <div
                                    class="material-description"
                                >

                                    ${escapeHTML(
                                        description
                                    )}

                                </div>



                                <div
                                    class="material-info"
                                >

                                    <div>

                                        <strong>
                                            Exam:
                                        </strong>

                                        ${escapeHTML(
                                            examName
                                        )}

                                    </div>


                                    <div>

                                        <strong>
                                            Subject:
                                        </strong>

                                        ${escapeHTML(
                                            subject
                                        )}

                                    </div>


                                    <div>

                                        <strong>
                                            Year:
                                        </strong>

                                        ${escapeHTML(
                                            year
                                        )}

                                    </div>


                                    <div>

                                        <strong>
                                            Part:
                                        </strong>

                                        ${escapeHTML(
                                            part
                                        )}

                                    </div>

                                </div>



                                <div
                                    class="material-actions"
                                >

                                    ${
                                        premium

                                            ? `

                                                <button
                                                    class="pdf-button premium-button"
                                                    disabled
                                                >
                                                    Premium PDF Access Coming Soon
                                                </button>

                                            `

                                            : `

                                                <button
                                                    class="pdf-button"
                                                    disabled
                                                >
                                                    PDF Access Coming Soon
                                                </button>

                                            `
                                    }

                                </div>

                            </article>

                        `;

                    }
                )
                .join("");


        materialsContainer.innerHTML = `

            <div class="material-grid">

                ${cards}

            </div>

        `;

    }



    /*
     * SEARCH
     */

    searchInput.addEventListener(
        "input",
        function() {

            renderMaterials();

        }
    );



    /*
     * START
     */

    loadMaterials();


</script>


</body>
