    <style>

        .hero {

            border: 1px solid #e5e7eb;

                0 4px 12px rgba(0, 0, 0, 0.04);

            display: flex;
            flex-direction: column;
        }


        .material-card h2 {
            margin: 0 0 12px;

            font-size: 20px;
            line-height: 1.35;
        }


        .badge-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;

            margin-bottom: 14px;
        }


        .badge {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 20px;

        .free-badge {

        }


        .material-description {

        }


        .material-info {
            border-top: 1px solid #e5e7eb;
            padding-top: 14px;

            display: grid;
            gap: 8px;

            margin-bottom: 18px;
        }


        .info-row {
            display: flex;
            gap: 8px;
            font-size: 14px;
        }


        .info-label {
            font-weight: 700;
            color: #334155;
        }


        .info-value {
            color: #64748b;
        }


        .material-actions {
            margin-top: auto;
        }


        .pdf-button {
            width: 100%;

            border: none;
            border-radius: 8px;

            padding: 12px 15px;

            background: #2563eb;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }


        .pdf-button:hover {

        }


        .pdf-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }


        .premium-button {

        }


        .premium-button:hover {

        }


        footer {
            background: #111827;
            color: #9ca3af;

            text-align: center;

        }


        @media (max-width: 700px) {

            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }


            nav {
                gap: 12px;
            }


            .hero h1 {
                font-size: 28px;
            }


            .container {
                padding: 25px 15px 50px;
            }

        }

<body>


<header>

    <div class="header-inner">

        <div class="logo">
            TN Warriors
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="jobs.html">
                Jobs
            </a>

            <a href="exams.html">
                Exams
            </a>

            <a href="defence.html">
                Defence
            </a>

        </nav>

    </div>

</header>



<section class="hero">

    <h1>
        Study Materials
    </h1>

    <p id="pageSubtitle">
        Previous Year Questions, Notes and Study Materials
    </p>

</section>



<main class="container">


    <div class="top-bar">

        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Search study materials..."
            >

        </div>


        <a
            href="exams.html"
            class="back-button"
        >
            Back to Exams
        </a>

    </div>



    <div
        id="statusBox"
        class="status-box loading"
    >
        Loading study materials...
    </div>



    <div
        id="materialsGrid"
        class="materials-grid"
    ></div>


</main>



<footer>

    © 2026 TN Warriors. All Rights Reserved.

</footer>



<!-- Supabase -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<script>

    /* =========================================
       SUPABASE CONFIGURATION
    ========================================= */

    const SUPABASE_URL =
        "https://nwipyqarobgelksdbkbk.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    /* =========================================
       PAGE ELEMENTS
    ========================================= */

    const materialsGrid =
        document.getElementById("materialsGrid");


    const statusBox =
        document.getElementById("statusBox");


    const searchInput =
        document.getElementById("searchInput");


    const pageSubtitle =
        document.getElementById("pageSubtitle");



    /* =========================================
       URL PARAMETERS
    ========================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const category =
        params.get("category");


    const examId =
        params.get("exam");



    /* =========================================
       CATEGORY NAMES
    ========================================= */

    const categoryNames = {

        ssc: "SSC",

        railway: "Railway",

        tnpsc: "TNPSC",

        defence: "Defence"

    };



    /* =========================================
       DATA
    ========================================= */

    let allMaterials = [];



    /* =========================================
       PAGE TITLE
    ========================================= */

    if (category && categoryNames[category]) {

        pageSubtitle.textContent =
            categoryNames[category] +
            " Study Materials";

    }



    /* =========================================
       LOAD STUDY MATERIALS
    ========================================= */

    async function loadMaterials() {

        statusBox.className =
            "status-box loading";

        statusBox.textContent =
            "Loading study materials...";


        materialsGrid.innerHTML = "";


        try {

            let query =
                supabaseClient
                    .from("study_materials")
                    .select(`
                        id,
                        slug,
                        title,
                        description,
                        exam_id,
                        exam_name,
                        subject,
                        year,
                        part,
                        file_path,
                        file_size_bytes,
                        file_type,
                        is_premium,
                        is_published,
                        sort_order,
                        created_at,
                        exams (
                            category
                        )
                    `)
                    .eq(
                        "is_published",
                        true
                    )
                    .order(
                        "sort_order",
                        {
                            ascending: true
                        }
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (examId) {

                query =
                    query.eq(
                        "exam_id",
                        examId
                    );

            }


            const {
                data,
                error
            } = await query;


            if (error) {

                throw error;

            }


            allMaterials =
                data || [];


            /*
             * Category filtering is done here
             * because category is connected through
             * exams.category.
             */

            if (category) {

                allMaterials =
                    allMaterials.filter(
                        material => {

                            return (
                                material.exams &&
                                material.exams.category === category
                            );

                        }
                    );

            }


            renderMaterials(
                allMaterials
            );


        } catch (error) {

            console.error(
                "Study materials error:",
                error
            );


            statusBox.className =
                "status-box error";


            statusBox.textContent =
                "Unable to load study materials. " +
                (error.message || "Please try again later.");

        }

    }



    /* =========================================
       RENDER MATERIALS
    ========================================= */

    function renderMaterials(
        materials
    ) {

        materialsGrid.innerHTML = "";


        if (
            !materials ||
            materials.length === 0
        ) {

            statusBox.className =
                "status-box empty";


            statusBox.textContent =
                "No study materials found.";


            return;

        }


        statusBox.style.display =
            "none";


        materials.forEach(
            material => {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "material-card";


                const premium =
                    material.is_premium;


                const description =
                    material.description ||
                    "Study material for TN Warriors students.";


                const examName =
                    material.exam_name ||
                    "Not specified";


                const subject =
                    material.subject ||
                    "General";


                const year =
                    material.year ||
                    "Not specified";


                const part =
                    material.part ||
                    "Not specified";


                const fileType =
                    material.file_type ||
                    "PDF";


                card.innerHTML = `

                    <h2>
                        ${escapeHTML(
                            material.title || "Study Material"
                        )}
                    </h2>


                    <div class="badge-row">

                        <span
                            class="badge ${
                                premium
                                    ? "premium-badge"
                                    : "free-badge"
                            }"
                        >
                            ${
                                premium
                                    ? "Premium"
                                    : "Free"
                            }
                        </span>


                        <span class="badge file-badge">
                            ${escapeHTML(fileType)}
                        </span>

                    </div>


                    <div class="material-description">
                        ${escapeHTML(description)}
                    </div>


                    <div class="material-info">

                        <div class="info-row">

                            <span class="info-label">
                                Exam:
                            </span>

                            <span class="info-value">
                                ${escapeHTML(examName)}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                Subject:
                            </span>

                            <span class="info-value">
                                ${escapeHTML(subject)}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                Year:
                            </span>

                            <span class="info-value">
                                ${escapeHTML(String(year))}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                Part:
                            </span>

                            <span class="info-value">
                                ${escapeHTML(part)}
                            </span>

                        </div>

                    </div>


                    <div class="material-actions">

                        <button
                            class="pdf-button ${
                                premium
                                    ? "premium-button"
                                    : ""
                            }"
                            data-material-id="${material.id}"
                            data-premium="${premium}"
                        >

                            ${
                                premium
                                    ? "Premium Access"
                                    : "Open PDF"
                            }

                        </button>

                    </div>

                `;


                materialsGrid.appendChild(
                    card
                );

            }
        );

    }



    /* =========================================
       OPEN SECURE PDF
    ========================================= */

    async function openPDF(
        materialId,
        button
    ) {

        if (!materialId) {

            alert(
                "Material ID is missing."
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "Opening PDF...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.functions.invoke(
                    "get-study-material",
                    {
                        body: {
                            material_id:
                                materialId
                        }
                    }
                );


            if (error) {

                throw error;

            }


            if (
                !data ||
                !data.success ||
                !data.signed_url
            ) {

                throw new Error(
                    data?.error ||
                    "Unable to create secure PDF link."
                );

            }


            /*
             * Open the temporary signed URL.
             * The URL expires after 5 minutes.
             */

            window.open(
                data.signed_url,
                "_blank",
                "noopener,noreferrer"
            );


        } catch (error) {

            console.error(
                "PDF access error:",
                error
            );


            alert(
                error.message ||
                "Unable to open PDF. Please try again."
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Open PDF";

        }

    }



    /* =========================================
       BUTTON CLICK
    ========================================= */

    materialsGrid.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    ".pdf-button"
                );


            if (!button) {
                return;
            }


            const materialId =
                button.dataset.materialId;


            const isPremium =
                button.dataset.premium === "true";


            /*
             * Premium access is intentionally
             * disabled for now.
             */

            if (isPremium) {

                alert(
                    "Premium access is not enabled yet."
                );

                return;

            }


            openPDF(
                materialId,
                button
            );

        }
    );



    /* =========================================
       SEARCH
    ========================================= */

    searchInput.addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            if (!search) {

                renderMaterials(
                    allMaterials
                );

                return;

            }


            const filtered =
                allMaterials.filter(
                    material => {

                        const title =
                            (
                                material.title ||
                                ""
                            ).toLowerCase();


                        const exam =
                            (
                                material.exam_name ||
                                ""
                            ).toLowerCase();


                        const subject =
                            (
                                material.subject ||
                                ""
                            ).toLowerCase();


                        const description =
                            (
                                material.description ||
                                ""
                            ).toLowerCase();


                        const year =
                            String(
                                material.year ||
                                ""
                            ).toLowerCase();


                        return (
                            title.includes(search) ||
                            exam.includes(search) ||
                            subject.includes(search) ||
                            description.includes(search) ||
                            year.includes(search)
                        );

                    }
                );


            renderMaterials(
                filtered
            );

        }
    );



    /* =========================================
       HTML ESCAPE
    ========================================= */

    function escapeHTML(
        value
    ) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }



    /* =========================================
       START
    ========================================= */

    loadMaterials();

</script>


</body>

</html>
