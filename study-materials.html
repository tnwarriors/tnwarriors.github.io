    <style>

        body {

        .top-bar {

            display: flex;

            justify-content: space-between;

        .top-bar h2 {

        .back-button {

        .filters {

        .button {

        .error {

        footer {

<body>

    <!-- MAIN -->

    <main>


        <div class="top-bar">

            >
                ← Back to Exams

        <!-- SEARCH -->

        <div class="filters">

            <input
                type="search"
                id="searchInput"
                placeholder="Search materials..."

    <!-- JAVASCRIPT -->

    <script>


        /* =========================================
           SUPABASE
        ========================================= */

        const SUPABASE_URL =
            "https://nwipyqarobgelksdbkbk.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           URL PARAMETERS
        ========================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const category =
            (
                params.get("category") ||
                ""
            ).toLowerCase();


        const examId =
            params.get("exam") ||
            "";


        /* =========================================
           ELEMENTS
        ========================================= */

        const materialList =
            document.getElementById(
                "materialList"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const pageTitle =
            document.getElementById(
                "pageTitle"
            );


        const pageDescription =
            document.getElementById(
                "pageDescription"
            );


        let allMaterials = [];


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================
           CATEGORY NAME
        ========================================= */

        const categoryNames = {

            ssc:
                "SSC Study Materials",

            railway:
                "Railway Study Materials",

            tnpsc:
                "TNPSC Study Materials",

            defence:
                "Defence Study Materials"

        };


        if (
            categoryNames[category]
        ) {

            pageTitle.textContent =
                categoryNames[category];

            pageDescription.textContent =
                "Previous Year Questions, Notes, Syllabus and preparation materials.";

        }


        /* =========================================
           LOAD MATERIALS
        ========================================= */

        async function loadMaterials() {

            materialList.innerHTML = `

                <div class="loading">
                    Loading study materials...
                </div>

            `;


            try {

                let query =
                    supabaseClient

                        .from(
                            "study_materials"
                        )

                        .select(`
                            id,
                            slug,
                            title,
                            description,
                            exam_name,
                            subject,
                            year,
                            part,
                            file_path,
                            file_size_bytes,
                            file_type,
                            is_premium,
                            is_published,
                            sort_order,
                            created_at
                        `)

                        .eq(
                            "is_published",
                            true
                        );


                /*
                    If an exam ID is provided,
                    filter by exam name later
                    when exam-specific material
                    mapping is added.
                */


                const {
                    data,
                    error
                } =
                    await query

                        .order(
                            "sort_order",
                            {
                                ascending: true
                            }
                        )

                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {

                    throw error;

                }


                allMaterials =
                    data || [];


                renderMaterials(
                    allMaterials
                );


            } catch (error) {

                console.error(
                    "LOAD MATERIALS ERROR:",
                    error
                );


                materialList.innerHTML = `

                    <div class="error">

                        <strong>
                            Unable to load study materials.
                        </strong>

                        <br><br>

                        ${escapeHtml(
                            error.message ||
                            "Unknown error"
                        )}

                    </div>

                `;

            }

        }


        /* =========================================
           RENDER MATERIALS
        ========================================= */

        function renderMaterials(
            materials
        ) {

            if (
                !materials ||
                !materials.length
            ) {

                materialList.innerHTML = `

                    <div class="empty">

                        No published study materials
                        available yet.

                        <br><br>

                        Materials will be added soon.

                    </div>

                `;

                return;

            }


            materialList.innerHTML = `

                <div class="material-list">

                    ${
                        materials.map(
                            function(material) {

                                return `

                                    <article
                                        class="material-card"
                                    >

                                        <h3>

                                            ${escapeHtml(
                                                material.title ||
                                                "Study Material"
                                            )}

                                        </h3>


                                        ${
                                            material.file_type
                                            ? `

                                                <span
                                                    class="badge pdf-badge"
                                                >
                                                    ${escapeHtml(
                                                        material.file_type.toUpperCase()
                                                    )}
                                                </span>

                                            `
                                            : ""
                                        }


                                        ${
                                            material.is_premium
                                            ? `

                                                <span
                                                    class="badge premium-badge"
                                                >
                                                    Premium
                                                </span>

                                            `
                                            :
                                            `

                                                <span
                                                    class="badge free-badge"
                                                >
                                                    Free
                                                </span>

                                            `
                                        }


                                        ${
                                            material.description
                                            ? `

                                                <div
                                                    class="material-description"
                                                >

                                                    ${escapeHtml(
                                                        material.description
                                                    )}

                                                </div>

                                            `
                                            : ""
                                        }


                                        <div
                                            class="material-info"
                                        >

                                            ${
                                                material.exam_name
                                                ? `

                                                    <strong>
                                                        Exam:
                                                    </strong>

                                                    ${escapeHtml(
                                                        material.exam_name
                                                    )}

                                                    <br>

                                                `
                                                : ""
                                            }


                                            ${
                                                material.subject
                                                ? `

                                                    <strong>
                                                        Subject:
                                                    </strong>

                                                    ${escapeHtml(
                                                        material.subject
                                                    )}

                                                    <br>

                                                `
                                                : ""
                                            }


                                            ${
                                                material.year
                                                                ? `

                                                    <strong>
                                                        Year:
                                                    </strong>
                                                    ${escapeHTML(material.year)}
                                                `
                                                : ""
                                            }

                                            ${
                                                material.part
                                                    ? `

                                                        <strong>
                                                            Part:
                                                        </strong>
                                                        ${escapeHTML(material.part)}
                                                    `
                                                    : ""
                                            }

                                            ${
                                                material.exam_name
                                                    ? `

                                                        <strong>
                                                            Exam:
                                                        </strong>
                                                        ${escapeHTML(material.exam_name)}
                                                    `
                                                    : ""
                                            }

                                            ${
                                                material.subject
                                                    ? `

                                                        <strong>
                                                            Subject:
                                                        </strong>
                                                        ${escapeHTML(material.subject)}
                                                    `
                                                    : ""
                                            }

                                        </div>

                                        <div class="material-actions">

                                            ${
                                                material.is_premium
                                                    ? `
                                                        <button
                                                            class="pdf-button premium-button"
                                                            disabled
                                                        >
                                                            Premium PDF
                                                        </button>
                                                    `
                                                    : `
                                                        <button
                                                            class="pdf-button"
                                                            disabled
                                                        >
                                                            PDF Access Coming Soon
                                                        </button>
                                                    `
                                            }

                                        </div>

                                    </div>
                                `;
                            })
                            .join("");

                        materialsContainer.innerHTML = cards;

                    } catch (error) {

                        console.error(error);

                        materialsContainer.innerHTML = `
                            <div class="empty-state">
                                <h3>Unable to load study materials</h3>
                                <p>
                                    Please try again later.
                                </p>
                            </div>
                        `;
                    }
                }

                searchInput.addEventListener(
                    "input",
                    function () {
                        renderMaterials();
                    }
                );

                loadMaterials();

            </script>

        </body>

</html>
