<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TN Warriors - Manage Jobs</title>

    <link rel="stylesheet" href="admin.css">

    <style>
        .page-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .page-card h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-row {
            display: flex;
            gap: 25px;
            margin-top: 15px;
        }

        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-primary {
            background: #111827;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 13px;
        }

        .jobs-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .jobs-toolbar input {
            flex: 1;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .job-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .job-item h3 {
            margin: 0 0 8px;
        }

        .job-meta {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .job-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 7px;
        }

        .published {
            background: #dcfce7;
            color: #166534;
        }

        .draft {
            background: #f3f4f6;
            color: #374151;
        }

        .featured {
            background: #fef3c7;
            color: #92400e;
        }

        .job-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .jobs-toolbar {
                flex-direction: column;
            }

            .checkbox-row {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header class="admin-header">
    <div>
        <h1>TN Warriors</h1>
        <p>Manage Jobs</p>
    </div>

    <button id="logoutButton">Logout</button>
</header>

<main class="page-container">

    <!-- ADD JOB -->
    <section class="page-card">

        <h2>Add New Job</h2>
        <p>Add and manage government job notifications.</p>

        <form id="jobForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="title">Job Title *</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="SSC GD Constable Recruitment 2026"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="slug">Slug *</label>
                    <input
                        type="text"
                        id="slug"
                        placeholder="ssc-gd-constable-2026"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="department">Department / Organization</label>
                    <input
                        type="text"
                        id="department"
                        placeholder="Staff Selection Commission"
                    >
                </div>

                <div class="form-group">
                    <label for="vacancies">Vacancies</label>
                    <input
                        type="text"
                        id="vacancies"
                        placeholder="25,487"
                    >
                </div>

                <div class="form-group full">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="Job description..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="qualification">Qualification</label>
                    <input
                        type="text"
                        id="qualification"
                        placeholder="10th Pass / 12th Pass / Degree..."
                    >
                </div>

                <div class="form-group">
                    <label for="age_limit">Age Limit</label>
                    <input
                        type="text"
                        id="age_limit"
                        placeholder="18 - 23 Years"
                    >
                </div>

                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input
                        type="text"
                        id="salary"
                        placeholder="₹21,700 - ₹69,100"
                    >
                </div>

                <div class="form-group">
                    <label for="application_fee">Application Fee</label>
                    <input
                        type="text"
                        id="application_fee"
                        placeholder="₹100 / No Fee"
                    >
                </div>

                <div class="form-group">
                    <label for="start_date">Application Start Date</label>
                    <input
                        type="date"
                        id="start_date"
                    >
                </div>

                <div class="form-group">
                    <label for="last_date">Last Date</label>
                    <input
                        type="date"
                        id="last_date"
                    >
                </div>

                <div class="form-group">
                    <label for="exam_date">Exam Date</label>
                    <input
                        type="date"
                        id="exam_date"
                    >
                </div>

                <div class="form-group">
                    <label for="status">Status</label>

                    <select id="status">
                        <option value="draft">Draft</option>
                        <option value="open">Open</option>
                        <option value="closed">Closed</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="notification_url">
                        Official Notification URL
                    </label>

                    <input
                        type="url"
                        id="notification_url"
                        placeholder="https://..."
                    >
                </div>

                <div class="form-group full">
                    <label for="apply_url">
                        Official Apply URL
                    </label>

                    <input
                        type="url"
                        id="apply_url"
                        placeholder="https://..."
                    >
                </div>

            </div>

            <div class="checkbox-row">

                <label>
                    <input
                        type="checkbox"
                        id="is_published"
                    >
                    Publish this job
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="is_featured"
                    >
                    Featured job
                </label>

            </div>

            <div class="button-row">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveJobButton"
                >
                    Save Job
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelEditButton"
                    style="display:none;"
                >
                    Cancel Edit
                </button>

            </div>

            <div id="formMessage" class="message"></div>

        </form>

    </section>


    <!-- EXISTING JOBS -->
    <section class="page-card">

        <h2>Existing Jobs</h2>

        <p>View and manage all jobs.</p>

        <div class="jobs-toolbar">

            <input
                type="text"
                id="searchJobs"
                placeholder="Search jobs..."
            >

            <button
                class="btn btn-secondary"
                id="refreshJobs"
                type="button"
            >
                Refresh
            </button>

        </div>

        <div id="jobsMessage" class="message"></div>

        <div id="jobsList">
            <div class="loading">
                Loading jobs...
            </div>
        </div>

    </section>

</main>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Existing admin connection -->
<script src="admin.js"></script>


<script>

let allJobs = [];
let editingJobId = null;


/* =========================
   MESSAGE
========================= */

function showMessage(elementId, message, type) {

    const element = document.getElementById(elementId);

    element.textContent = message;

    element.className = "message " + type;

}


/* =========================
   START
========================= */

window.addEventListener("load", function () {

    startPage();

});


async function startPage() {

    try {

        if (typeof supabaseClient === "undefined") {

            showMessage(
                "jobsMessage",
                "ERROR: Supabase client not found. Check admin.js.",
                "error"
            );

            return;
        }


        const userResult =
            await supabaseClient.auth.getUser();


        if (userResult.error) {

            showMessage(
                "jobsMessage",
                "Authentication error: " +
                userResult.error.message,
                "error"
            );

            return;
        }


        const user = userResult.data.user;


        if (!user) {

            window.location.href = "index.html";

            return;
        }


        const profileResult =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .single();


        if (profileResult.error) {

            showMessage(
                "jobsMessage",
                "Profile error: " +
                profileResult.error.message,
                "error"
            );

            return;
        }


        if (
            !profileResult.data ||
            profileResult.data.role !== "admin"
        ) {

            alert("Admin access required.");

            window.location.href = "dashboard.html";

            return;
        }


        await loadJobs();

    }

    catch (error) {

        console.error(error);

        showMessage(
            "jobsMessage",
            "Page error: " + error.message,
            "error"
        );

    }

}


/* =========================
   LOAD JOBS
========================= */

async function loadJobs() {

    const jobsList =
        document.getElementById("jobsList");


    jobsList.innerHTML =
        '<div class="loading">Loading jobs...</div>';


    try {

        const result =
            await supabaseClient
                .from("jobs")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


        console.log("JOBS RESULT:", result);


        if (result.error) {

            throw result.error;

        }


        allJobs = result.data || [];


        renderJobs(allJobs);

    }

    catch (error) {

        console.error("LOAD JOBS ERROR:", error);

        jobsList.innerHTML = "";

        showMessage(
            "jobsMessage",
            "Unable to load jobs: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   RENDER JOBS
========================= */

function renderJobs(jobs) {

    const jobsList =
        document.getElementById("jobsList");


    if (!jobs || jobs.length === 0) {

        jobsList.innerHTML =
            "<p>No jobs found.</p>";

        return;
    }


    jobsList.innerHTML = jobs.map(function(job) {

        const published =
            job.is_published === true;

        const featured =
            job.is_featured === true;


        return `

            <div class="job-item">

                <h3>${escapeHtml(job.title || "Untitled Job")}</h3>

                <div class="job-meta">

                    ${escapeHtml(job.department || "")}

                    ${job.vacancies
                        ? " • Vacancies: " +
                          escapeHtml(job.vacancies)
                        : ""
                    }

                </div>


                <span class="job-status ${
                    published ? "published" : "draft"
                }">

                    ${
                        published
                        ? "Published"
                        : "Draft"
                    }

                </span>


                ${
                    featured
                    ? `
                    <span class="job-status featured">
                        Featured
                    </span>
                    `
                    : ""
                }


                <span class="job-status">
                    ${escapeHtml(job.status || "draft")}
                </span>


                <div class="job-actions">

                    <button
                        class="btn btn-secondary btn-small"
                        onclick="editJob('${job.id}')"
                    >
                        Edit
                    </button>


                    <button
                        class="btn btn-secondary btn-small"
                        onclick="togglePublish(
                            '${job.id}',
                            ${published}
                        )"
                    >

                        ${
                            published
                            ? "Unpublish"
                            : "Publish"
                        }

                    </button>


                    <button
                        class="btn btn-secondary btn-small"
                        onclick="toggleFeatured(
                            '${job.id}',
                            ${featured}
                        )"
                    >

                        ${
                            featured
                            ? "Remove Featured"
                            : "Make Featured"
                        }

                    </button>


                    <button
                        class="btn btn-danger btn-small"
                        onclick="deleteJob('${job.id}')"
                    >
                        Delete
                    </button>

                </div>

            </div>

        `;

    }).join("");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   SAVE JOB
========================= */

document
    .getElementById("jobForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const button =
            document.getElementById("saveJobButton");


        button.disabled = true;

        button.textContent = "Saving...";


        try {

            const jobData = {

                title:
                    document.getElementById("title").value.trim(),

                slug:
                    document.getElementById("slug").value.trim(),

                department:
                    document.getElementById("department").value.trim(),

                description:
                    document.getElementById("description").value.trim(),

                vacancies:
                    document.getElementById("vacancies").value.trim(),

                qualification:
                    document.getElementById("qualification").value.trim(),

                age_limit:
                    document.getElementById("age_limit").value.trim(),

                salary:
                    document.getElementById("salary").value.trim(),

                application_fee:
                    document.getElementById("application_fee").value.trim(),

                start_date:
                    document.getElementById("start_date").value || null,

                last_date:
                    document.getElementById("last_date").value || null,

                exam_date:
                    document.getElementById("exam_date").value || null,

                notification_url:
                    document
                        .getElementById("notification_url")
                        .value
                        .
