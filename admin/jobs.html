<script>
document.addEventListener("DOMContentLoaded", function () {

    const SUPABASE_URL =
        "https://nwipyqarobgelksdbkbk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";

    const jobsList =
        document.getElementById("jobsList");

    const jobForm =
        document.getElementById("jobForm");

    const searchInput =
        document.getElementById("searchInput");

    const refreshButton =
        document.getElementById("refreshButton");

    const cancelButton =
        document.getElementById("cancelButton");

    const saveButton =
        document.getElementById("saveButton");

    const formTitle =
        document.getElementById("formTitle");

    let allJobs = [];

    if (!window.supabase) {
        jobsList.innerHTML =
            "<p style='color:red;font-weight:bold;'>Supabase library failed to load.</p>";
        return;
    }

    const jobsSupabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    function showMessage(text, type) {
        const message =
            document.getElementById("message");

        message.textContent = text;
        message.className =
            "message " + type;
    }

    function clearMessage() {
        const message =
            document.getElementById("message");

        message.textContent = "";
        message.className = "message";
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function loadJobs() {

        jobsList.innerHTML =
            "<div class='loading'>Loading jobs...</div>";

        try {

            const { data, error } =
                await jobsSupabase
                    .from("jobs")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });

            if (error) {
                throw error;
            }

            allJobs = data || [];

            renderJobs(allJobs);

        } catch (error) {

            console.error(error);

            jobsList.innerHTML =
                "<p style='color:red;font-weight:bold;'>" +
                "Unable to load jobs: " +
                escapeHtml(error.message) +
                "</p>";
        }
    }

    function renderJobs(jobs) {

        if (!jobs.length) {
            jobsList.innerHTML =
                "<p>No jobs found.</p>";
            return;
        }

        jobsList.innerHTML =
            jobs.map(function (job) {

                const published =
                    job.is_published === true;

                const featured =
                    job.is_featured === true;

                return `
                    <div class="job-item">

                        <div class="job-title">
                            ${escapeHtml(
                                job.title || "Untitled Job"
                            )}
                        </div>

                        <div class="job-meta">

                            <strong>Department:</strong>
                            ${escapeHtml(
                                job.department || "-"
                            )}
                            <br>

                            <strong>Vacancies:</strong>
                            ${escapeHtml(
                                job.vacancies || "-"
                            )}
                            <br>

                            <strong>Qualification:</strong>
                            ${escapeHtml(
                                job.qualification || "-"
                            )}
                            <br>

                            <strong>Last Date:</strong>
                            ${escapeHtml(
                                job.last_date || "-"
                            )}
                            <br>

                            <strong>Status:</strong>
                            ${escapeHtml(
                                job.status || "-"
                            )}
                            <br>

                            <span class="status ${
                                published
                                    ? "status-published"
                                    : "status-draft"
                            }">
                                ${
                                    published
                                        ? "Published"
                                        : "Not Published"
                                }
                            </span>

                            ${
                                featured
                                    ? `
                                    <span class="status status-published">
                                        Featured
                                    </span>
                                    `
                                    : ""
                            }

                        </div>

                        <div class="job-actions">

                            <button
                                class="edit-btn"
                                onclick="editJob('${job.id}')">
                                Edit
                            </button>

                            <button
                                class="publish-btn"
                                onclick="togglePublish(
                                    '${job.id}',
                                    ${published}
                                )">
                                ${
                                    published
                                        ? "Unpublish"
                                        : "Publish"
                                }
                            </button>

                            <button
                                class="feature-btn"
                                onclick="toggleFeatured(
                                    '${job.id}',
                                    ${featured}
                                )">
                                ${
                                    featured
                                        ? "Remove Featured"
                                        : "Make Featured"
                                }
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteJob('${job.id}')">
                                Delete
                            </button>

                        </div>

                    </div>
                `;

            }).join("");
    }    searchInput.addEventListener(
        "input",
        function () {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();

            if (!search) {
                renderJobs(allJobs);
                return;
            }

            const filtered =
                allJobs.filter(function (job) {

                    return (
                        String(job.title || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(job.department || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(job.slug || "")
                            .toLowerCase()
                            .includes(search)
                    );

                });

            renderJobs(filtered);
        }
    );


    jobForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearMessage();

            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            try {

                const jobId =
                    document.getElementById("jobId").value;

                const jobData = {

                    title:
                        document.getElementById("title")
                            .value.trim(),

                    slug:
                        document.getElementById("slug")
                            .value.trim(),

                    department:
                        document.getElementById("department")
                            .value.trim(),

                    description:
                        document.getElementById("description")
                            .value.trim(),

                    vacancies:
                        document.getElementById("vacancies")
                            .value.trim(),

                    qualification:
                        document.getElementById("qualification")
                            .value.trim(),

                    age_limit:
                        document.getElementById("age_limit")
                            .value.trim(),

                    salary:
                        document.getElementById("salary")
                            .value.trim(),

                    application_fee:
                        document.getElementById("application_fee")
                            .value.trim(),

                    start_date:
                        document.getElementById("start_date")
                            .value || null,

                    last_date:
                        document.getElementById("last_date")
                            .value || null,

                    exam_date:
                        document.getElementById("exam_date")
                            .value || null,

                    notification_url:
                        document.getElementById("notification_url")
                            .value.trim(),

                    apply_url:
                        document.getElementById("apply_url")
                            .value.trim(),

                    status:
                        document.getElementById("status")
                            .value,

                    is_published:
                        document.getElementById("is_published")
                            .checked,

                    is_featured:
                        document.getElementById("is_featured")
                            .checked
                };


                if (!jobData.title) {
                    throw new Error(
                        "Job title is required."
                    );
                }

                if (!jobData.slug) {
                    throw new Error(
                        "Slug is required."
                    );
                }


                let result;


                if (jobId) {

                    result =
                        await jobsSupabase
                            .from("jobs")
                            .update(jobData)
                            .eq("id", jobId)
                            .select()
                            .single();

                } else {

                    result =
                        await jobsSupabase
                            .from("jobs")
                            .insert(jobData)
                            .select()
                            .single();
                }


                if (result.error) {
                    throw result.error;
                }


                showMessage(
                    jobId
                        ? "Job updated successfully."
                        : "Job added successfully.",
                    "success"
                );


                resetForm();

                await loadJobs();


            } catch (error) {

                console.error(
                    "Save job error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Failed to save job.",
                    "error"
                );

            } finally {

                saveButton.disabled = false;
                saveButton.textContent = "Save Job";
            }
        }
    );


    window.editJob = function (id) {

        const job =
            allJobs.find(function (item) {
                return item.id === id;
            });

        if (!job) {
            return;
        }


        document.getElementById("jobId").value =
            job.id || "";

        document.getElementById("title").value =
            job.title || "";

        document.getElementById("slug").value =
            job.slug || "";

        document.getElementById("department").value =
            job.department || "";

        document.getElementById("description").value =
            job.description || "";

        document.getElementById("vacancies").value =
            job.vacancies || "";

        document.getElementById("qualification").value =
            job.qualification || "";

        document.getElementById("age_limit").value =
            job.age_limit || "";

        document.getElementById("salary").value =
            job.salary || "";

        document.getElementById("application_fee").value =
            job.application_fee || "";

        document.getElementById("start_date").value =
            job.start_date || "";

        document.getElementById("last_date").value =
            job.last_date || "";

        document.getElementById("exam_date").value =
            job.exam_date || "";

        document.getElementById("notification_url").value =
            job.notification_url || "";

        document.getElementById("apply_url").value =
            job.apply_url || "";

        document.getElementById("status").value =
            job.status || "draft";

        document.getElementById("is_published").checked =
            job.is_published === true;

        document.getElementById("is_featured").checked =
            job.is_featured === true;


        formTitle.textContent = "Edit Job";

        saveButton.textContent = "Update Job";

        cancelButton.style.display = "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    };


    cancelButton.addEventListener(
        "click",
        function () {
            resetForm();
        }
    );


    function resetForm() {

        jobForm.reset();

        document.getElementById("jobId").value = "";

        formTitle.textContent = "Add New Job";

        saveButton.textContent = "Save Job";

        cancelButton.style.display = "none";
    }


    window.togglePublish = async function (
        id,
        currentStatus
    ) {

        try {

            const { error } =
                await jobsSupabase
                    .from("jobs")
                    .update({
                        is_published:
                            !currentStatus
                    })
                    .eq("id", id);


            if (error) {
                throw error;
            }

            await loadJobs();

        } catch (error) {

            console.error(error);

            alert(
                error.message ||
                "Unable to update publish status."
            );
        }
    };    window.toggleFeatured = async function (
        id,
        currentStatus
    ) {

        try {

            const { error } =
                await jobsSupabase
                    .from("jobs")
                    .update({
                        is_featured:
                            !currentStatus
                    })
                    .eq("id", id);


            if (error) {
                throw error;
            }

            await loadJobs();

        } catch (error) {

            console.error(error);

            alert(
                error.message ||
                "Unable to update featured status."
            );
        }
    };


    window.deleteJob = async function (id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this job?"
            );


        if (!confirmDelete) {
            return;
        }


        try {

            const { error } =
                await jobsSupabase
                    .from("jobs")
                    .delete()
                    .eq("id", id);


            if (error) {
                throw error;
            }


            showMessage(
                "Job deleted successfully.",
                "success"
            );


            await loadJobs();

        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to delete job.",
                "error"
            );
        }
    };


    refreshButton.addEventListener(
        "click",
        async function () {

            await loadJobs();

        }
    );


    /*
     * Start loading jobs
     */
    jobsList.innerHTML =
    "<p style='color:green;font-weight:bold;text-align:center;'>JavaScript is working</p>";

});
</script>

</body>
</html>
