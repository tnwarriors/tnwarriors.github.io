<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TN Warriors - Manage Jobs</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <!-- HEADER -->

    <header class="admin-header">

        <div>

            <h1>TN Warriors</h1>

            <p>Manage Jobs</p>

        </div>

        <div>

            <button
                id="backButton"
                type="button"
            >
                Dashboard
            </button>

            <button
                id="logoutButton"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="dashboard-container">

        <!-- ADD / EDIT JOB -->

        <section class="admin-card">

            <h2 id="formTitle">
                Add New Job
            </h2>


            <form id="jobForm">

                <!-- JOB TITLE -->

                <div class="form-group">

                    <label for="title">
                        Job Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: SSC GD Constable"
                        required
                    >

                </div>


                <!-- SLUG -->

                <div class="form-group">

                    <label for="slug">
                        Slug
                    </label>

                    <input
                        type="text"
                        id="slug"
                        placeholder="ssc-gd-constable"
                        required
                    >

                </div>


                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label for="department">
                        Department / Organization
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Staff Selection Commission"
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="central">
                            Central Government
                        </option>

                        <option value="tamilnadu">
                            Tamil Nadu Government
                        </option>

                        <option value="defence">
                            Defence
                        </option>

                        <option value="railway">
                            Railway
                        </option>

                        <option value="ssc">
                            SSC
                        </option>

                        <option value="10-12">
                            10th / 12th Pass
                        </option>

                        <option value="diploma">
                            Diploma
                        </option>

                        <option value="degree">
                            Degree
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Job description"
                    ></textarea>

                </div>


                <!-- VACANCIES -->

                <div class="form-group">

                    <label for="vacancies">
                        Vacancies
                    </label>

                    <input
                        type="text"
                        id="vacancies"
                        placeholder="Example: 5000"
                    >

                </div>


                <!-- QUALIFICATION -->

                <div class="form-group">

                    <label for="qualification">
                        Qualification
                    </label>

                    <input
                        type="text"
                        id="qualification"
                        placeholder="Example: 10th Pass"
                    >

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label for="age_limit">
                        Age Limit
                    </label>

                    <input
                        type="text"
                        id="age_limit"
                        placeholder="Example: 18 - 23 Years"
                    >

                </div>


                <!-- SALARY -->

                <div class="form-group">

                    <label for="salary">
                        Salary
                    </label>

                    <input
                        type="text"
                        id="salary"
                        placeholder="Example: ₹21,700 - ₹69,100"
                    >

                </div>


                <!-- FEE -->

                <div class="form-group">

                    <label for="application_fee">
                        Application Fee
                    </label>

                    <input
                        type="text"
                        id="application_fee"
                        placeholder="Example: ₹100"
                    >

                </div>


                <!-- START DATE -->

                <div class="form-group">

                    <label for="start_date">
                        Start Date
                    </label>

                    <input
                        type="date"
                        id="start_date"
                    >

                </div>


                <!-- LAST DATE -->

                <div class="form-group">

                    <label for="last_date">
                        Last Date
                    </label>

                    <input
                        type="date"
                        id="last_date"
                    >

                </div>


                <!-- EXAM DATE -->

                <div class="form-group">

                    <label for="exam_date">
                        Exam Date
                    </label>

                    <input
                        type="date"
                        id="exam_date"
                    >

                </div>


                <!-- NOTIFICATION URL -->

                <div class="form-group">

                    <label for="notification_url">
                        Official Notification URL
                    </label>

                    <input
                        type="url"
                        id="notification_url"
                        placeholder="https://..."
                    >

                </div>


                <!-- APPLY URL -->

                <div class="form-group">

                    <label for="apply_url">
                        Official Apply URL
                    </label>

                    <input
                        type="url"
                        id="apply_url"
                        placeholder="https://..."
                    >

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="draft">
                            Draft
                        </option>

                        <option value="open">
                            Open
                        </option>

                        <option value="closed">
                            Closed
                        </option>

                        <option value="archived">
                            Archived
                        </option>

                    </select>

                </div>


                <!-- PUBLISHED -->

                <div class="form-group">

                    <label>

                        <input
                            type="checkbox"
                            id="is_published"
                        >

                        Publish this job

                    </label>

                </div>


                <!-- FEATURED -->

                <div class="form-group">

                    <label>

                        <input
                            type="checkbox"
                            id="is_featured"
                        >

                        Featured job

                    </label>

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        id="saveButton"
                    >
                        Save Job
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        style="display:none;"
                    >
                        Cancel Edit
                    </button>

                </div>


                <p id="formMessage"></p>

            </form>

        </section>


        <!-- EXISTING JOBS -->

        <section class="admin-card">

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                    flex-wrap:wrap;
                "
            >

                <h2>
                    Existing Jobs
                </h2>

                <button
                    type="button"
                    id="refreshButton"
                >
                    Refresh
                </button>

            </div>


            <!-- SEARCH -->

            <div class="form-group">

                <label for="searchInput">
                    Search Jobs
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by title, department or category..."
                >

            </div>


            <!-- JOB COUNT -->

            <p id="jobCount">
                Loading jobs...
            </p>


            <!-- JOB LIST -->

            <div id="jobsList">

                <p>
                    Loading jobs...
                </p>

            </div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================
           SUPABASE
        ========================================= */

        const SUPABASE_URL =
            "https://nwipyqarobgelksdbkbk.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_6FfBPZ1nc5AQqjVRi_VhgA_WZC1tQ-J";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           ELEMENTS
        ========================================= */

        const jobForm =
            document.getElementById("jobForm");

        const jobsList =
            document.getElementById("jobsList");

        const jobCount =
            document.getElementById("jobCount");

        const searchInput =
            document.getElementById("searchInput");

        const saveButton =
            document.getElementById("saveButton");

        const cancelButton =
            document.getElementById("cancelButton");

        const refreshButton =
            document.getElementById("refreshButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const backButton =
            document.getElementById("backButton");

        const formMessage =
            document.getElementById("formMessage");

        const formTitle =
            document.getElementById("formTitle");


        let allJobs = [];

        let editingJobId = null;


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           ADMIN CHECK
        ========================================= */

        async function checkAdmin() {

            try {

                const {
                    data: {
                        user
                    },
                    error: userError
                } =
                    await supabaseClient.auth.getUser();


                if (userError || !user) {

                    window.location.href =
                        "index.html";

                    return false;

                }


                const {
                    data: profile,
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .select("role")
                        .eq("id", user.id)
                        .single();


                if (
                    profileError ||
                    !profile ||
                    profile.role !== "admin"
                ) {

                    await supabaseClient.auth.signOut();

                    alert(
                        "Admin access required."
                    );

                    window.location.href =
                        "index.html";

                    return false;

                }


                return true;

            } catch (error) {

                console.error(
                    "ADMIN CHECK ERROR:",
                    error
                );

                window.location.href =
                    "index.html";

                return false;

            }

        }


        /* =========================================
           LOAD JOBS
        ========================================= */

        async function loadJobs() {

            jobsList.innerHTML =
                "<p>Loading jobs...</p>";

            jobCount.textContent =
                "Loading jobs...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("jobs")
                        .select(`
                            id,
                            title,
                            slug,
                            department,
                            category,
                            description,
                            vacancies,
                            qualification,
                            age_limit,
                            salary,
                            application_fee,
                            start_date,
                            last_date,
                            exam_date,
                            notification_url,
                            apply_url,
                            status,
                            is_published,
                            is_featured,
                            created_at,
                            updated_at
                        `)
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                console.log(
                    "JOBS DATA:",
                    data
                );

                console.log(
                    "JOBS ERROR:",
                    error
                );


                if (error) {

                    throw error;

                }


                allJobs =
                    data || [];


                jobCount.textContent =
                    allJobs.length +
                    " job(s) found";


                renderJobs(
                    allJobs
                );


            } catch (error) {

                console.error(
                    "LOAD JOBS ERROR:",
                    error
                );


                jobCount.textContent =
                    "Unable to load jobs";


                jobsList.innerHTML = `

                    <div
                        style="
                            padding:20px;
                            border:1px solid #ddd;
                            border-radius:8px;
                        "
                    >

                        <strong>
                            Unable to load jobs
                        </strong>

                        <br><br>

                        ${escapeHtml(
                            error.message ||
                            "Unknown error"
                        )}

                    </div>

                `;

            }

        }


        /* =========================================
           RENDER JOBS
        ========================================= */

        function renderJobs(jobs) {

            if (!jobs || !jobs.length) {

                jobsList.innerHTML =
                    "<p>No jobs found.</p>";

                jobCount.textContent =
                    "0 job(s) found";

                return;

            }


            jobCount.textContent =
                jobs.length +
                " job(s) found";


            jobsList.innerHTML =

                jobs.map(function(job) {

                    const published =
                        job.is_published === true;


                    const featured =
                        job.is_featured === true;


                    return `

                        <div
                            class="job-item"
                            style="
                                border:1px solid #ddd;
                                padding:18px;
                                margin-top:15px;
                                border-radius:10px;
                            "
                        >

                            <div
                                class="job-title"
                                style="
                                    font-size:20px;
                                    font-weight:bold;
                                    margin-bottom:10px;
                                "
                            >

                                ${escapeHtml(
                                    job.title ||
                                    "Untitled Job"
                                )}

                            </div>


                                                <div
                                class="job-meta"
                                style="
                                    line-height:1.8;
                                "
                            >

                                <strong>
                                    Department:
                                </strong>

                                ${escapeHtml(
                                    job.department ||
                                    "-"
                                )}

                                <br>

                                <strong>
                                    Category:
                                </strong>

                                ${escapeHtml(
                                    job.category ||
                                    "-"
                                )}

                                <br>

                                <strong>
                                    Vacancies:
                                </strong>

                                ${escapeHtml(
                                    job.vacancies ||
                                    "-"
                                )}

                                <br>

                                <strong>
                                    Qualification:
                                </strong>

                                ${escapeHtml(
                                    job.qualification ||
                                    "-"
                                )}

                                <br>

                                <strong>
                                    Last Date:
                                </strong>

                                ${escapeHtml(
                                    job.last_date ||
                                    "-"
                                )}

                                <br>

                                <strong>
                                    Status:
                                </strong>

                                ${escapeHtml(
                                    job.status ||
                                    "-"
                                )}

                                <br><br>

                                <span
                                    style="
                                        display:inline-block;
                                        padding:5px 10px;
                                        border-radius:5px;
                                        background:
                                        ${
                                            published
                                            ? "#d4edda"
                                            : "#f8d7da"
                                        };
                                        color:
                                        ${
                                            published
                                            ? "#155724"
                                            : "#721c24"
                                        };
                                        margin-right:5px;
                                    "
                                >

                                    ${
                                        published
                                        ? "Published"
                                        : "Not Published"
                                    }

                                </span>

                                ${
                                    featured
                                    ? `
                                        <span
                                            style="
                                                display:inline-block;
                                                padding:5px 10px;
                                                border-radius:5px;
                                                background:#fff3cd;
                                                color:#856404;
                                            "
                                        >
                                            Featured
                                        </span>
                                    `
                                    : ""
                                }

                            </div>


                            <div
                                class="job-actions"
                                style="
                                    display:flex;
                                    gap:8px;
                                    flex-wrap:wrap;
                                    margin-top:15px;
                                "
                            >

                                <button
                                    type="button"
                                    onclick="
                                        editJob('${job.id}')
                                    "
                                >
                                    Edit
                                </button>


                                <button
                                    type="button"
                                    onclick="
                                        togglePublish(
                                            '${job.id}',
                                            ${published}
                                        )
                                    "
                                >

                                    ${
                                        published
                                        ? "Unpublish"
                                        : "Publish"
                                    }

                                </button>


                                <button
                                    type="button"
                                    onclick="
                                        toggleFeatured(
                                            '${job.id}',
                                            ${featured}
                                        )
                                    "
                                >

                                    ${
                                        featured
                                        ? "Remove Featured"
                                        : "Make Featured"
                                    }

                                </button>


                                <button
                                    type="button"
                                    onclick="
                                        deleteJob('${job.id}')
                                    "
                                >
                                    Delete
                                </button>

                            </div>

                        </div>

                    `;

                }).join("");

        }


        /* =========================================
           SAVE JOB
        ========================================= */

        jobForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                saveButton.disabled = true;

                saveButton.textContent =
                    "Saving...";

                formMessage.textContent = "";

                try {

                    const jobData = {

                        title:
                            document
                                .getElementById("title")
                                .value
                                .trim(),

                        slug:
                            document
                                .getElementById("slug")
                                .value
                                .trim(),

                        department:
                            document
                                .getElementById("department")
                                .value
                                .trim(),

                        category:
                            document
                                .getElementById("category")
                                .value,

                        description:
                            document
                                .getElementById("description")
                                .value
                                .trim(),

                        vacancies:
                            document
                                .getElementById("vacancies")
                                .value
                                .trim(),

                        qualification:
                            document
                                .getElementById("qualification")
                                .value
                                .trim(),

                        age_limit:
                            document
                                .getElementById("age_limit")
                                .value
                                .trim(),

                        salary:
                            document
                                .getElementById("salary")
                                .value
                                .trim(),

                        application_fee:
                            document
                                .getElementById("application_fee")
                                .value
                                .trim(),

                        start_date:
                            document
                                .getElementById("start_date")
                                .value || null,

                        last_date:
                            document
                                .getElementById("last_date")
                                .value || null,

                        exam_date:
                            document
                                .getElementById("exam_date")
                                .value || null,

                        notification_url:
                            document
                                .getElementById("notification_url")
                                .value
                                .trim() || null,

                        apply_url:
                            document
                                .getElementById("apply_url")
                                .value
                                .trim() || null,

                        status:
                            document
                                .getElementById("status")
                                .value,

                        is_published:
                            document
                                .getElementById("is_published")
                                .checked,

                        is_featured:
                            document
                                .getElementById("is_featured")
                                .checked
                    };


                    let result;


                    if (editingJobId) {

                        result =
                            await supabaseClient
                                .from("jobs")
                                .update(jobData)
                                .eq(
                                    "id",
                                    editingJobId
                                );

                    } else {

                        result =
                            await supabaseClient
                                .from("jobs")
                                .insert([jobData]);

                    }


                    if (result.error) {
                        throw result.error;
                    }


                    formMessage.textContent =
                        editingJobId
                        ? "Job updated successfully."
                        : "Job added successfully.";

                    formMessage.style.color = "green";


                    resetForm();

                    await loadJobs();


                } catch (error) {

                    console.error(
                        "SAVE JOB ERROR:",
                        error
                    );

                    formMessage.textContent =
                        error.message ||
                        "Unable to save job.";

                    formMessage.style.color = "red";

                }


                saveButton.disabled = false;

                saveButton.textContent =
                    editingJobId
                    ? "Update Job"
                    : "Save Job";

            }
        );


        /* =========================================
           EDIT JOB
        ========================================= */

        window.editJob = function(id) {

            const job =
                allJobs.find(function(item) {
                    return item.id === id;
                });


            if (!job) {
                alert("Job not found.");
                return;
            }


            editingJobId = id;

            formTitle.textContent =
                "Edit Job";

            saveButton.textContent =
                "Update Job";

            cancelButton.style.display =
                "inline-block";


            document.getElementById("title").value =
                job.title || "";

            document.getElementById("slug").value =
                job.slug || "";

            document.getElementById("department").value =
                job.department || "";

            document.getElementById("category").value =
                job.category || "";

            document.getElementById("description").value =
                job.description || "";

            document.getElementById("vacancies").value =
                job.vacancies || "";

            document.getElementById("qualification").value =
                job.qualification || "";

            document.getElementById("age_limit").value =
                job.age_limit || "";

            document.getElementById("salary").value =
                job.salary || "";

            document.getElementById("application_fee").value =
                job.application_fee || "";

            document.getElementById("start_date").value =
                job.start_date || "";

            document.getElementById("last_date").value =
                job.last_date || "";

            document.getElementById("exam_date").value =
                job.exam_date || "";

            document.getElementById("notification_url").value =
                job.notification_url || "";

            document.getElementById("apply_url").value =
                job.apply_url || "";

            document.getElementById("status").value =
                job.status || "draft";

            document.getElementById("is_published").checked =
                job.is_published === true;

            document.getElementById("is_featured").checked =
                job.is_featured === true;


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


        /* =========================================
           CANCEL EDIT
        ========================================= */

        cancelButton.addEventListener(
            "click",
            function() {
                resetForm();
            }
        );


        /* =========================================
           RESET FORM
        ========================================= */

        function resetForm() {

            jobForm.reset();

            editingJobId = null;

            formTitle.textContent =
                "Add New Job";

            saveButton.textContent =
                "Save Job";

            cancelButton.style.display =
                "none";

            formMessage.textContent = "";

        }


        /* =========================================
           PUBLISH / UNPUBLISH
        ========================================= */

        window.togglePublish =
            async function(id, currentStatus) {

                try {

                    const { error } =
                        await supabaseClient
                            .from("jobs")
                            .update({
                                is_published:
                                    !currentStatus
                            })
                            .eq("id", id);


                    if (error) {
                        throw error;
                    }


                    await loadJobs();


                } catch (error) {

                    console.error(
                        "PUBLISH ERROR:",
                        error
                    );

                    alert(error.message);

                }

            };


        /* =========================================
           FEATURED
        ========================================= */

        window.toggleFeatured =
            async function(id, currentStatus) {

                try {

                    const { error } =
                        await supabaseClient
                            .from("jobs")
                            .update({
                                is_featured:
                                    !currentStatus
                            })
                            .eq("id", id);


                    if (error) {
                        throw error;
                    }


                    await loadJobs();


                } catch (error) {

                    console.error(
                        "FEATURED ERROR:",
                        error
                    );

                    alert(error.message);

                }

            };


        /* =========================================
           DELETE JOB
        ========================================= */

        window.deleteJob =
            async function(id) {

                const confirmed =
                    confirm(
                        "Are you sure you want to delete this job?"
                    );


                if (!confirmed) {
                    return;
                }


                try {

                    const { error } =
                        await supabaseClient
                            .from("jobs")
                            .delete()
                            .eq("id", id);


                    if (error) {
                        throw error;
                    }


                    await loadJobs();


                } catch (error) {

                    console.error(
                        "DELETE ERROR:",
                        error
                    );

                    alert(error.message);

                }

            };


        /* =========================================
           SEARCH
        ========================================= */

        searchInput.addEventListener(
            "input",
            function() {

                const search =
                    searchInput.value
                        .trim()
                        .toLowerCase();


                if (!search) {

                    renderJobs(allJobs);

                    return;

                }


                const filtered =
                    allJobs.filter(
                        function(job) {

                            return (

                                (
                                    job.title ||
                                    ""
                                )
                                .toLowerCase()
                                                                .includes(search)

                                ||

                                (
                                    job.department ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(search)

                                ||

                                (
                                    job.category ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(search)

                            );

                        }
                    );


                renderJobs(filtered);

            }
        );


        /* =========================================
           REFRESH
        ========================================= */

        refreshButton.addEventListener(
            "click",
            async function() {

                refreshButton.disabled = true;

                refreshButton.textContent =
                    "Refreshing...";


                await loadJobs();


                refreshButton.disabled = false;

                refreshButton.textContent =
                    "Refresh";

            }
        );


        /* =========================================
           LOGOUT
        ========================================= */

        logoutButton.addEventListener(
            "click",
            async function() {

                logoutButton.disabled = true;

                logoutButton.textContent =
                    "Logging out...";


                await supabaseClient
                    .auth
                    .signOut();


                window.location.href =
                    "index.html";

            }
        );


        /* =========================================
           DASHBOARD
        ========================================= */

        backButton.addEventListener(
            "click",
            function() {

                window.location.href =
                    "dashboard.html";

            }
        );


        /* =========================================
           START PAGE
        ========================================= */

        async function startPage() {

            const isAdmin =
                await checkAdmin();


            if (!isAdmin) {
                return;
            }


            await loadJobs();

        }


        startPage();

    </script>

</body>

</html>
