<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TN Warriors - Manage Jobs</title>

    <link rel="stylesheet" href="admin.css">

    <style>
        .job-form-card {
            margin-top: 20px;
        }

        .job-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .job-actions button {
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: 600;
        }

        .btn-blue {
            background: #2563eb;
        }

        .btn-green {
            background: #16a34a;
        }

        .btn-purple {
            background: #7c3aed;
        }

        .btn-red {
            background: #dc2626;
        }

        .btn-gray {
            background: #64748b;
        }

        .jobs-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .jobs-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .job-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            background: white;
        }

        .job-item h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .job-meta {
            line-height: 1.7;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            margin-right: 5px;
        }

        .published {
            background: #dcfce7;
            color: #166534;
        }

        .unpublished {
            background: #fee2e2;
            color: #991b1b;
        }

        .featured {
            background: #ede9fe;
            color: #5b21b6;
        }

        .normal {
            background: #e2e8f0;
            color: #334155;
        }

        #jobMessage {
            margin-top: 15px;
            font-weight: 600;
        }

        #jobsMessage {
            margin-bottom: 15px;
        }

        .empty-message {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<header class="admin-header">

    <div>
        <h1>TN Warriors</h1>
        <p>Job Management</p>
    </div>

    <div>
        <button type="button" onclick="goDashboard()">
            Dashboard
        </button>

        <button type="button" id="logoutButton">
            Logout
        </button>
    </div>

</header>


<main class="dashboard-container">

    <!-- ADD / EDIT JOB -->

    <section class="welcome-card">

        <h2 id="formTitle">
            Add New Job
        </h2>

        <p>
            Add and manage government job notifications.
        </p>

    </section>


    <section class="dashboard-card job-form-card">

        <form id="jobForm">

            <input
                type="hidden"
                id="jobId"
            >


            <label for="title">
                Job Title *
            </label>

            <input
                type="text"
                id="title"
                placeholder="SSC GD Constable Recruitment 2026"
                required
            >


            <label for="slug">
                Slug *
            </label>

            <input
                type="text"
                id="slug"
                placeholder="ssc-gd-constable-2026"
                required
            >


            <label for="department">
                Department / Organization
            </label>

            <input
                type="text"
                id="department"
                placeholder="Staff Selection Commission"
            >


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Job description..."
            ></textarea>


            <label for="vacancies">
                Vacancies
            </label>

            <input
                type="text"
                id="vacancies"
                placeholder="25,487"
            >


            <label for="qualification">
                Qualification
            </label>

            <textarea
                id="qualification"
                rows="3"
                placeholder="10th Pass / 12th Pass / Degree..."
            ></textarea>


            <label for="age_limit">
                Age Limit
            </label>

            <input
                type="text"
                id="age_limit"
                placeholder="18 - 23 Years"
            >


            <label for="salary">
                Salary
            </label>

            <input
                type="text"
                id="salary"
                placeholder="₹21,700 - ₹69,100"
            >


            <label for="application_fee">
                Application Fee
            </label>

            <input
                type="text"
                id="application_fee"
                placeholder="₹100 / No Fee"
            >


            <label for="start_date">
                Application Start Date
            </label>

            <input
                type="date"
                id="start_date"
            >


            <label for="last_date">
                Last Date
            </label>

            <input
                type="date"
                id="last_date"
            >


            <label for="exam_date">
                Exam Date
            </label>

            <input
                type="date"
                id="exam_date"
            >


            <label for="notification_url">
                Official Notification URL
            </label>

            <input
                type="url"
                id="notification_url"
                placeholder="https://..."
            >


            <label for="apply_url">
                Official Apply URL
            </label>

            <input
                type="url"
                id="apply_url"
                placeholder="https://..."
            >


            <label for="status">
                Status
            </label>

            <select id="status">

                <option value="draft">
                    Draft
                </option>

                <option value="open">
                    Open
                </option>

                <option value="closed">
                    Closed
                </option>

                <option value="archived">
                    Archived
                </option>

            </select>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="is_published"
                >

                Publish this job

            </label>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="is_featured"
                >

                Featured job

            </label>


            <div class="job-actions">

                <button
                    type="submit"
                    id="saveJobButton"
                    class="btn-blue"
                >
                    Save Job
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                    class="btn-gray"
                    style="display:none;"
                    onclick="cancelEdit()"
                >
                    Cancel Edit
                </button>

            </div>


            <p id="jobMessage"></p>

        </form>

    </section>



    <!-- EXISTING JOBS -->

    <section
        class="welcome-card"
        style="margin-top:25px;"
    >

        <h2>
            Existing Jobs
        </h2>

        <p>
            View and manage all jobs.
        </p>

    </section>


    <section class="dashboard-card">

        <div class="jobs-toolbar">

            <input
                type="text"
                id="searchJobs"
                placeholder="Search jobs..."
            >

            <button
                type="button"
                class="btn-blue"
                onclick="loadJobs()"
            >
                Refresh
            </button>

        </div>


        <div id="jobsMessage"></div>


        <div id="jobsList">

            Loading jobs...

        </div>

    </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- YOUR EXISTING SUPABASE CONFIG -->

<script src="admin.js"></script>


<script>

let allJobs = [];
let editingJobId = null;


/* =========================================
   PAGE START
========================================= */

document.addEventListener("DOMContentLoaded", async function () {

    try {

        const adminOK = await checkAdmin();

        if (!adminOK) {
            return;
        }

        await loadJobs();

    } catch (error) {

        console.error(error);

        showJobsMessage(
            "Unable to load admin page.",
            "red"
        );

    }

});



/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin() {

    if (
        typeof supabaseClient === "undefined"
    ) {

        alert(
            "Supabase connection is missing. Check admin.js."
        );

        return false;
    }


    const {
        data: userData,
        error: userError
    } =
        await supabaseClient.auth.getUser();


    if (
        userError ||
        !userData ||
        !userData.user
    ) {

        window.location.href = "index.html";

        return false;
    }


    const user = userData.user;


    const {
        data: profile,
        error: profileError
    } =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .maybeSingle();


    if (
        profileError ||
        !profile ||
        profile.role !== "admin"
    ) {

        alert(
            "Admin access required."
        );

        window.location.href =
            "dashboard.html";

        return false;
    }


    return true;

}



/* =========================================
   LOAD JOBS
========================================= */

async function loadJobs() {

    const jobsList =
        document.getElementById("jobsList");


    jobsList.innerHTML =
        "<p>Loading jobs...</p>";


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("jobs")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {
            throw error;
        }


        allJobs = data || [];


        renderJobs(allJobs);


    } catch (error) {

        console.error(error);


        jobsList.innerHTML = `
            <div class="empty-message">
                <p style="color:red;">
                    ${escapeHtml(error.message)}
                </p>
            </div>
        `;

    }

}



/* =========================================
   DISPLAY JOBS
========================================= */

function renderJobs(jobs) {

    const jobsList =
        document.getElementById("jobsList");


    if (!jobs.length) {

        jobsList.innerHTML = `
            <div class="empty-message">
                <p>No jobs found.</p>
            </div>
        `;

        return;
    }


    let html = "";


    jobs.forEach(function (job) {

        const publishedClass =
            job.is_published
                ? "published"
                : "unpublished";


        const publishedText =
            job.is_published
                ? "Published"
                : "Unpublished";


        const featuredClass =
            job.is_featured
                ? "featured"
                : "normal";


        const featuredText =
            job.is_featured
                ? "Featured"
                : "Normal";


        html += `

            <div class="job-item">

                <h3>
                    ${escapeHtml(job.title)}
                </h3>


                <div class="job-meta">

                    <div>
                        <strong>Department:</strong>
                        ${escapeHtml(
                            job.department || "-"
                        )}
                    </div>


                    <div>
                        <strong>Vacancies:</strong>
                        ${escapeHtml(
                            job.vacancies || "-"
                        )}
                    </div>


                    <div>
                        <strong>Qualification:</strong>
                        ${escapeHtml(
                            job.qualification || "-"
                        )}
                    </div>


                    <div>
                        <strong>Status:</strong>
                        ${escapeHtml(
                            job.status || "-"
                        )}
                    </div>


                    <div style="margin-top:8px;">

                        <span
                            class="status-badge ${publishedClass}"
                        >
                            ${publishedText}
                        </span>


                        <span
                            class="status-badge ${featuredClass}"
                        >
                            ${featuredText}
                        </span>

                    </div>

                </div>


                <div class="job-actions">

                    <button
                        type="button"
                        class="btn-blue"
                        onclick="editJob('${job.id}')"
                    >
                        Edit
                    </button>


                    <button
                        type="button"
                        class="btn-green"
                        onclick="
                            togglePublish(
                                '${job.id}',
                                ${job.is_published}
                            )
                        "
                    >
                        ${
                            job.is_published
                                ? "Unpublish"
                                : "Publish"
                        }
                    </button>


                    <button
                        type="button"
                        class="btn-purple"
                        onclick="
                            toggleFeatured(
                                '${job.id}',
                                ${job.is_featured}
                            )
                        "
                    >
                        ${
                            job.is_featured
                                ? "Remove Featured"
                                : "Make Featured"
                        }
                    </button>


                    <button
                        type="button"
                        class="btn-red"
                        onclick="deleteJob('${job.id}')"
                    >
                        Delete
                    </button>

                </div>

            </div>

        `;

    });


    jobsList.innerHTML = html;

}



/* =========================================
   SAVE / UPDATE JOB
========================================= */

document
    .getElementById("jobForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const button =
                document.getElementById(
                    "saveJobButton"
                );


            const message =
                document.getElementById(
                    "jobMessage"
                );


            button.disabled = true;


            button.textContent =
                editingJobId
                    ? "Updating..."
                    : "Saving...";


            message.textContent = "";


            try {

                const jobData = {

                    title:
                        getValue("title"),

                    slug:
                        getValue("slug"),

                    department:
                        getValueOrNull(
                            "department"
                        ),

                    description:
                        getValueOrNull(
                            "description"
                        ),

                    vacancies:
                        getValueOrNull(
                            "vacancies"
                        ),

                    qualification:
                        getValueOrNull(
                            "qualification"
                        ),

                    age_limit:
                        getValueOrNull(
                            "age_limit"
                        ),

                    salary:
                        getValueOrNull(
                            "salary"
                        ),

                    application_fee:
                        getValueOrNull(
                            "application_fee"
                        ),

                    start_date:
                        getValueOrNull(
                            "start_date"
                        ),

                    last_date:
                        getValueOrNull(
                            "last_date"
                        ),

                    exam_date:
                        getValueOrNull(
                            "exam_date"
                        ),

                    notification_url:
                        getValueOrNull(
                            "notification_url"
                        ),

                    apply_url:
                        getValueOrNull(
                            "apply_url"
                        ),

                    status:
                        document
                            .getElementById(
                                "status"
                            )
                            .value,

                    is_published:
                        document
                            .getElementById(
                                "is_published"
                            )
                            .checked,

                    is_featured:
                        document
                            .getElementById(
                                "is_featured"
                            )
                            .checked

                };


                if (!jobData.title) {

                    throw new Error(
                        "Job title is required."
                    );

                }


                if (!jobData.slug) {

                    throw new Error(
                        "Slug is required."
                    );

                }



                /* UPDATE */

                if (editingJobId) {

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("jobs")
                            .update(jobData)
                            .eq(
                                "id",
                                editingJobId
                            );
