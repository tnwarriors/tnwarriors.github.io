<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TN Warriors - Manage Jobs</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="admin-header">
    <div>
        <h1>TN Warriors</h1>
        <p>Job Management</p>
    </div>

    <div>
        <button onclick="goDashboard()">Dashboard</button>
        <button id="logoutButton">Logout</button>
    </div>
</header>


<main class="dashboard-container">

    <!-- ADD / EDIT JOB -->
    <section class="welcome-card">
        <h2 id="formTitle">Add New Job</h2>
        <p>Create, edit and publish government job notifications.</p>
    </section>


    <section class="dashboard-card">

        <form id="jobForm">

            <input type="hidden" id="jobId">


            <label>Job Title *</label>
            <input
                type="text"
                id="title"
                placeholder="Example: SSC GD Constable Recruitment 2026"
                required
            >


            <label>Slug *</label>
            <input
                type="text"
                id="slug"
                placeholder="ssc-gd-constable-2026"
                required
            >


            <label>Department / Organization</label>
            <input
                type="text"
                id="department"
                placeholder="Staff Selection Commission"
            >


            <label>Description</label>
            <textarea
                id="description"
                rows="5"
                placeholder="Job description..."
            ></textarea>


            <label>Vacancies</label>
            <input
                type="text"
                id="vacancies"
                placeholder="Example: 25,487"
            >


            <label>Qualification</label>
            <textarea
                id="qualification"
                rows="3"
                placeholder="10th Pass / 12th Pass / Degree..."
            ></textarea>


            <label>Age Limit</label>
            <input
                type="text"
                id="age_limit"
                placeholder="18 - 23 Years"
            >


            <label>Salary</label>
            <input
                type="text"
                id="salary"
                placeholder="₹21,700 - ₹69,100"
            >


            <label>Application Fee</label>
            <input
                type="text"
                id="application_fee"
                placeholder="₹100 / No Fee"
            >


            <label>Application Start Date</label>
            <input
                type="date"
                id="start_date"
            >


            <label>Last Date</label>
            <input
                type="date"
                id="last_date"
            >


            <label>Exam Date</label>
            <input
                type="date"
                id="exam_date"
            >


            <label>Official Notification URL</label>
            <input
                type="url"
                id="notification_url"
                placeholder="https://..."
            >


            <label>Official Apply URL</label>
            <input
                type="url"
                id="apply_url"
                placeholder="https://..."
            >


            <label>Status</label>

            <select id="status">

                <option value="draft">
                    Draft
                </option>

                <option value="open">
                    Open
                </option>

                <option value="closed">
                    Closed
                </option>

                <option value="archived">
                    Archived
                </option>

            </select>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="is_published"
                >

                Publish this job

            </label>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="is_featured"
                >

                Featured job

            </label>


            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;">

                <button
                    type="submit"
                    id="saveJobButton"
                    style="background:#2563eb;color:white;"
                >
                    Save Job
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                    style="display:none;"
                    onclick="cancelEdit()"
                >
                    Cancel Edit
                </button>

            </div>


            <p id="jobMessage"></p>

        </form>

    </section>



    <!-- JOB LIST -->
    <section class="welcome-card" style="margin-top:25px;">

        <h2>Existing Jobs</h2>

        <p>
            Manage all jobs added to TN Warriors.
        </p>

    </section>


    <section class="dashboard-card">

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">

            <input
                type="text"
                id="searchJobs"
                placeholder="Search jobs..."
                style="flex:1;min-width:220px;"
            >

            <button
                onclick="loadJobs()"
                style="background:#2563eb;color:white;"
            >
                Refresh
            </button>

        </div>


        <div id="jobsMessage"></div>

        <div id="jobsList">

            Loading jobs...

        </div>

    </section>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js"></script>



<script>

let allJobs = [];

let editingJobId = null;



/* ================================
   PAGE LOAD
================================ */

document.addEventListener("DOMContentLoaded", async function () {

    const isAdmin = await verifyAdmin();

    if (!isAdmin) {
        return;
    }

    await loadJobs();

});



/* ================================
   ADMIN CHECK
================================ */

async function verifyAdmin() {

    try {

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !user) {

            window.location.href = "index.html";

            return false;
        }


        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .single();


        if (
            profileError ||
            !profile ||
            profile.role !== "admin"
        ) {

            alert("Admin access required.");

            window.location.href = "dashboard.html";

            return false;
        }


        return true;

    }

    catch (error) {

        console.error(error);

        window.location.href = "index.html";

        return false;
    }

}



/* ================================
   LOAD JOBS
================================ */

async function loadJobs() {

    const jobsList = document.getElementById("jobsList");

    jobsList.innerHTML = "Loading jobs...";


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("jobs")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {
            throw error;
        }


        allJobs = data || [];

        renderJobs(allJobs);

    }

    catch (error) {

        console.error(error);

        jobsList.innerHTML =
            `<p style="color:red;">
                Failed to load jobs: ${escapeHtml(error.message)}
            </p>`;

    }

}



/* ================================
   RENDER JOBS
================================ */

function renderJobs(jobs) {

    const jobsList =
        document.getElementById("jobsList");


    if (!jobs || jobs.length === 0) {

        jobsList.innerHTML =
            `<p>No jobs found.</p>`;

        return;
    }


    let html = "";


    jobs.forEach(function (job) {

        const publishedText =
            job.is_published
                ? "Published"
                : "Unpublished";


        const featuredText =
            job.is_featured
                ? "Featured"
                : "Normal";


        const statusText =
            job.status || "draft";


        html += `

        <div
            style="
                border:1px solid #ddd;
                border-radius:12px;
                padding:18px;
                margin-bottom:15px;
                background:#fff;
            "
        >

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    gap:15px;
                    flex-wrap:wrap;
                "
            >

                <div style="flex:1;min-width:220px;">

                    <h3 style="margin-top:0;">
                        ${escapeHtml(job.title || "Untitled Job")}
                    </h3>


                    <p>
                        <strong>Department:</strong>
                        ${escapeHtml(job.department || "-")}
                    </p>


                    <p>
                        <strong>Vacancies:</strong>
                        ${escapeHtml(job.vacancies || "-")}
                    </p>


                    <p>
                        <strong>Status:</strong>
                        ${escapeHtml(statusText)}
                    </p>


                    <p>
                        <strong>Visibility:</strong>
                        ${publishedText}
                    </p>


                    <p>
                        <strong>Type:</strong>
                        ${featuredText}
                    </p>

                </div>


                <div
                    style="
                        display:flex;
                        gap:8px;
                        flex-wrap:wrap;
                        align-items:flex-start;
                    "
                >

                    <button
                        onclick="editJob('${job.id}')"
                        style="background:#2563eb;color:white;"
                    >
                        Edit
                    </button>


                    <button
                        onclick="togglePublish('${job.id}', ${job.is_published})"
                        style="background:#16a34a;color:white;"
                    >
                        ${job.is_published ? "Unpublish" : "Publish"}
                    </button>


                    <button
                        onclick="toggleFeatured('${job.id}', ${job.is_featured})"
                        style="background:#7c3aed;color:white;"
                    >
                        ${job.is_featured ? "Remove Featured" : "Make Featured"}
                    </button>


                    <button
                        onclick="deleteJob('${job.id}')"
                        style="background:#dc2626;color:white;"
                    >
                        Delete
                    </button>

                </div>

            </div>

        </div>

        `;

    });


    jobsList.innerHTML = html;

}



/* ================================
   ADD / UPDATE JOB
================================ */

document
    .getElementById("jobForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();


        const saveButton =
            document.getElementById("saveJobButton");

        const message =
            document.getElementById("jobMessage");


        saveButton.disabled = true;

        saveButton.textContent =
            editingJobId
                ? "Updating..."
                : "Saving...";

        message.textContent = "";


        try {

            const jobData = {

                title:
                    document
                        .getElementById("title")
                        .value
                        .trim(),

                slug:
                    document
                        .getElementById("slug")
                        .value
                        .trim(),

                department:
                    valueOrNull("department"),

                description:
                    valueOrNull("description"),

                vacancies:
                    valueOrNull("vacancies"),

                qualification:
                    valueOrNull("qualification"),

                age_limit:
                    valueOrNull("age_limit"),

                salary:
                    valueOrNull("salary"),

                application_fee:
                    valueOrNull("application_fee"),

                start_date:
                    valueOrNull("start_date"),

                last_date:
                    valueOrNull("last_date"),

                exam_date:
                    valueOrNull("exam_date"),

                notification_url:
                    valueOrNull("notification_url"),

                apply_url:
                    valueOrNull("apply_url"),

                status:
                    document
                        .getElementById("status")
                        .value,

                is_published:
                    document
                        .getElementById("is_published")
                        .checked,

                is_featured:
                    document
                        .getElementById("is_featured")
                        .checked

            };


            if (!jobData.title) {

                throw new Error(
                    "Job title is required."
                );

            }


            if (!jobData.slug) {

                throw new Error(
                    "Slug is required."
                );

            }



            /* UPDATE */

            if (editingJobId) {

                const {
                    error
                } = await supabaseClient
                    .from("jobs")
                    .update(jobData)
                    .eq("id", editingJobId);


                if (error) {
                    throw error;
                }


                message.textContent =
                    "Job updated successfully.";

            }


            /* INSERT */

            else {

                const {
                    error
                } = await supabaseClient
                    .from("jobs")
                    .insert(jobData);


                if (error) {
                    throw error;
                }


                message.textContent =
                    "Job added successfully.";

            }


            message.style.color = "green";


            resetJobForm();


            await loadJobs();

        }


        catch (error) {

            console.error(error);

            message.textContent =
                error.message ||
                "Something went wrong.";

            message.style.color = "red";

        }


        finally {

            saveButton.disabled = false;

            saveButton.textContent =
                editingJobId
                    ? "Update Job"
                    : "Save Job";

        }

    });



/* ================================
   EDIT JOB
================================ */

function editJob(jobId) {

    const job =
        allJobs.find(
            item => item.id === jobId
        );


    if (!job) {

        alert("Job not found.");

        return;
    }


    editingJobId = jobId;


    document.getElementById("formTitle")
        .textContent = "Edit Job";


    document.getElementById("jobId")
        .value = job.id;


    document.getElementById("title")
        .value = job.title || "";


    document.getElementById("slug")
        .value = job.slug || "";


    document.getElementById("department")
        .value = job.department || "";


    document.getElementById("description")
        .value = job.description || "";


    document.getElementById("vacancies")
        .value = job.vacancies || "";


    document.getElementById("qualification")
        .value = job.qualification || "";


    document.getElementById("age_limit")
        .value = job.age_limit || "";


    document.getElementById("salary")
        .value = job.salary || "";


    document.getElementById("application_fee")
        .value = job.application_fee || "";


    document.getElementById("start_date")
        .value = job.start_date || "";


    document.getElementById("last_date")
        .value = job.last_date || "";


    document.getElementById("exam_date")
        .value = job.exam_date || "";


    document.getElementById("notification_url")
        .value = job.notification_url || "";


    document.getElementById("apply_url")
        .value = job.apply_url || "";


    document.getElementById("status")
        .value = job.status || "draft";


    document.getElementById("is_published")
        .checked = !!job.is_published;


    document.getElementById("is_featured")
        .checked = !!job.is_featured;


    document.getElementById("saveJobButton")
        .textContent = "Update Job";


    document.getElementById("cancelEditButton")
        .style.display = "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* ================================
   CANCEL EDIT
================================ */

function cancelEdit() {

    resetJobForm();

}



/* ================================
   RESET FORM
================================ */

function resetJobForm() {

    editingJobId = null;


    document
        .getElementById("jobForm")
        .reset();


    document.getElementById("jobId")
        .value = "";


    document.getElementById("formTitle")
        .textContent = "Add New Job";


    document.getElementById("saveJobButton")
        .textContent = "Save Job";


    document.getElementById("cancelEditButton")
        .style.display = "none";

}



/* ================================
   PUBLISH / UNPUBLISH
================================ */

async function togglePublish(jobId, currentValue) {

    const newValue = !currentValue;


    try {

        const {
            error
        } = await supabaseClient
            .from("jobs")
            .update({
                is_published: newValue
            })
            .eq("id", jobId);


        if (error) {
            throw error;
        }


        await loadJobs();

    }

    catch (error) {

        console.error(error);

        alert(
            "Failed to change publish status: " +
            error.message
        );

    }

}



/* ================================
   FEATURED
================================ */

async function toggleFeatured(jobId, currentValue) {

    const newValue = !currentValue;


    try {

        const {
            error
        } = await supabaseClient
            .from("jobs")
            .update({
                is_featured: newValue
            })
            .eq("id", jobId);


        if (error) {
            throw error;
        }


        await loadJobs();

    }

    catch (error) {

        console.error(error);

        alert(
            "Failed to change featured status: " +
            error.message
        );

    }

}



/* ================================
   DELETE JOB
================================ */

async function deleteJob(jobId) {

    const job =
        allJobs.find(
            item => item.id === jobId
        );


    const jobTitle =
        job
            ? job.title
            :
