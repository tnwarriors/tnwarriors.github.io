<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TN Warriors - Manage Jobs</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <style>

        .jobs-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .jobs-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .job-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            background: #fff;
        }

        .job-item h3 {
            margin-top: 0;
        }

        .job-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .job-actions button {
            border: none;
            border-radius: 6px;
            padding: 9px 14px;
            cursor: pointer;
            color: white;
            font-weight: 600;
        }

        .btn-blue {
            background: #2563eb;
        }

        .btn-green {
            background: #16a34a;
        }

        .btn-purple {
            background: #7c3aed;
        }

        .btn-red {
            background: #dc2626;
        }

        .btn-gray {
            background: #64748b;
        }

        .badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 5px;
        }

        .badge-green {
            background: #dcfce7;
            color: #166534;
        }

        .badge-red {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-purple {
            background: #ede9fe;
            color: #5b21b6;
        }

        .badge-gray {
            background: #e2e8f0;
            color: #334155;
        }

        #jobMessage,
        #jobsMessage {
            margin-top: 12px;
            font-weight: 600;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .success-box {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

    </style>

</head>


<body>


<header class="admin-header">

    <div>

        <h1>TN Warriors</h1>

        <p>Job Management</p>

    </div>


    <div>

        <button
            type="button"
            onclick="goDashboard()"
        >
            Dashboard
        </button>


        <button
            type="button"
            id="logoutButton"
        >
            Logout
        </button>

    </div>

</header>



<main class="dashboard-container">


    <!-- ADD JOB -->

    <section class="welcome-card">

        <h2 id="formTitle">
            Add New Job
        </h2>

        <p>
            Add and manage government job notifications.
        </p>

    </section>



    <section class="dashboard-card">


        <form id="jobForm">


            <input
                type="hidden"
                id="jobId"
            >


            <label>
                Job Title *
            </label>

            <input
                type="text"
                id="title"
                placeholder="SSC GD Constable Recruitment 2026"
                required
            >


            <label>
                Slug *
            </label>

            <input
                type="text"
                id="slug"
                placeholder="ssc-gd-constable-2026"
                required
            >


            <label>
                Department / Organization
            </label>

            <input
                type="text"
                id="department"
                placeholder="Staff Selection Commission"
            >


            <label>
                Description
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Job description..."
            ></textarea>


            <label>
                Vacancies
            </label>

            <input
                type="text"
                id="vacancies"
                placeholder="25,487"
            >


            <label>
                Qualification
            </label>

            <textarea
                id="qualification"
                rows="3"
                placeholder="10th Pass / 12th Pass / Degree..."
            ></textarea>


            <label>
                Age Limit
            </label>

            <input
                type="text"
                id="age_limit"
                placeholder="18 - 23 Years"
            >


            <label>
                Salary
            </label>

            <input
                type="text"
                id="salary"
                placeholder="₹21,700 - ₹69,100"
            >


            <label>
                Application Fee
            </label>

            <input
                type="text"
                id="application_fee"
                placeholder="₹100 / No Fee"
            >


            <label>
                Application Start Date
            </label>

            <input
                type="date"
                id="start_date"
            >


            <label>
                Last Date
            </label>

            <input
                type="date"
                id="last_date"
            >


            <label>
                Exam Date
            </label>

            <input
                type="date"
                id="exam_date"
            >


            <label>
                Official Notification URL
            </label>

            <input
                type="url"
                id="notification_url"
                placeholder="https://..."
            >


            <label>
                Official Apply URL
            </label>

            <input
                type="url"
                id="apply_url"
                placeholder="https://..."
            >


            <label>
                Status
            </label>

            <select id="status">

                <option value="draft">
                    Draft
                </option>

                <option value="open">
                    Open
                </option>

                <option value="closed">
                    Closed
                </option>

                <option value="archived">
                    Archived
                </option>

            </select>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="is_published"
                >

                Publish this job

            </label>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="is_featured"
                >

                Featured job

            </label>


            <div class="job-actions">

                <button
                    type="submit"
                    id="saveJobButton"
                    class="btn-blue"
                >
                    Save Job
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                    class="btn-gray"
                    style="display:none"
                    onclick="cancelEdit()"
                >
                    Cancel Edit
                </button>

            </div>


            <div id="jobMessage"></div>


        </form>

    </section>



    <!-- EXISTING JOBS -->

    <section
        class="welcome-card"
        style="margin-top:25px"
    >

        <h2>
            Existing Jobs
        </h2>

        <p>
            View and manage all jobs.
        </p>

    </section>



    <section class="dashboard-card">


        <div class="jobs-toolbar">

            <input
                type="text"
                id="searchJobs"
                placeholder="Search jobs..."
            >


            <button
                type="button"
                class="btn-blue"
                onclick="loadJobs()"
            >
                Refresh
            </button>

        </div>


        <div id="jobsMessage"></div>


        <div id="jobsList">

            Loading jobs...

        </div>


    </section>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js"></script>



<script>


let allJobs = [];

let editingJobId = null;



/* =====================================
   PAGE START
===================================== */

window.addEventListener(
    "load",
    function () {

        startPage();

    }
);



async function startPage() {

    try {

        if (
            typeof supabaseClient ===
            "undefined"
        ) {

            showJobsError(
                "Supabase client not found. Please check admin.js."
            );

            return;

        }


        const {
            data,
            error
        } =
            await supabaseClient.auth.getUser();


        if (error) {

            showJobsError(
                "Authentication error: " +
                error.message
            );

            return;

        }


        if (!data || !data.user) {

            window.location.href =
                "index.html";

            return;

        }


        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq(
                    "id",
                    data.user.id
                )
                .single();


        if (profileError) {

            showJobsError(
                "Profile error: " +
                profileError.message
            );

            return;

        }


        if (
            !profile ||
            profile.role !== "admin"
        ) {

            alert(
                "Admin access required."
            );

            window.location.href =
                "dashboard.html";

            return;

        }


        await loadJobs();

    }


    catch (error) {

        console.error(error);

        showJobsError(
            "Page error: " +
            error.message
        );

    }

}



/* =====================================
   LOAD JOBS
===================================== */

async function loadJobs() {

    const jobsList =
        document.getElementById(
            "jobsList"
        );


    jobsList.innerHTML =
        "<p>Loading jobs...</p>";


    try {

        const result =
            await supabaseClient
                .from("jobs")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        console.log(
            "Jobs query result:",
            result
        );


        if (result.error) {

            throw result.error;

        }


        allJobs =
            result.data || [];


        renderJobs(
            allJobs
        );


    }


    catch (error) {

        console.error(
            "LOAD JOBS ERROR:",
            error
        );


        showJobsError(
            "Unable to load jobs: " +
            error.message
        );

    }

}



/* =====================================
   RENDER
===================================== */

function renderJobs(jobs) {

    const jobsList =
        document.getElementById(
            "jobsList"
        );


    if (
        !jobs ||
        jobs.length === 0
    ) {

        jobsList.innerHTML = `
            <div class="success-box">
                No jobs found.
            </div>
        `;

        return;

    }


    let html = "";


    jobs.forEach(
        function (job) {


            const publishBadge =
                job.is_published
                    ? `
                        <span class="badge badge-green">
                            Published
                        </span>
                      `
                    : `
                        <span class="badge badge-red">
                            Unpublished
                        </span>
                      `;


            const featuredBadge =
                job.is_featured
                    ? `
                        <span class="badge badge-purple">
                            Featured
                        </span>
                      `
                    : `
                        <span class="badge badge-gray">
                            Normal
                        </span>
                      `;


            html += `

                <div class="job-item">

                    <h3>
                        ${escapeHtml(
                            job.title
                        )}
                    </h3>


                    <p>
                        <strong>
                            Department:
                        </strong>

                        ${escapeHtml(
                            job.department || "-"
                        )}
                    </p>


                    <p>
                        <strong>
                            Vacancies:
                        </strong>

                        ${escapeHtml(
                            job.vacancies || "-"
                        )}
                    </p>


                    <p>
                        <strong>
                            Qualification:
                        </strong>

                        ${escapeHtml(
                            job.qualification || "-"
                        )}
                    </p>


                    <p>
                        <strong>
                            Status:
                        </strong>

                        ${escapeHtml(
                            job.status || "-"
                        )}
                    </p>


                    <div>

                        ${publishBadge}

                        ${featuredBadge}

                    </div>


                    <div class="job-actions">


                        <button
                            type="button"
                            class="btn-blue"
                            onclick="
                                editJob(
                                    '${job.id}'
                                )
                            "
                        >
                            Edit
                        </button>


                        <button
                            type="button"
                            class="btn-green"
                            onclick="
                                togglePublish(
                                    '${job.id}',
                                    ${job.is_published}
                                )
                            "
                        >

                            ${
                                job.is_published
                                    ? "Unpublish"
                                    : "Publish"
                            }

                        </button>


                        <button
                            type="button"
                            class="btn-purple"
                            onclick="
                                toggleFeatured(
                                    '${job.id}',
                                    ${job.is_featured}
                                )
                            "
                        >

                            ${
                                job.is_featured
                                    ? "Remove Featured"
                                    : "Make Featured"
                            }

                        </button>


                        <button
                            type="button"
                            class="btn-red"
                            onclick="
                                deleteJob(
                                    '${job.id}'
                                )
                            "
                        >
                            Delete
                        </button>


                    </div>


                </div>

            `;

        }
    );


    jobsList.innerHTML =
        html;

}



/* =====================================
   SAVE JOB
===================================== */

    .getElementById("jobForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const button =
                document.getElementById(
                    "saveJobButton"
                );


            const message =
                document.getElementById(
                    "jobMessage"
                );


            button.disabled = true;


            button.textContent =
                editingJobId
                    ? "Updating..."
                    : "Saving...";


            message.innerHTML = "";


            try {


                const jobData = {

                    title:
                        getValue(
                            "title"
                        ),

                    slug:
                        getValue(

                        ),

                    department:
                        getValueOrNull(
                            "department"
                        ),

                    description:
                        getValueOrNull(
                            "description"
                        ),

                    vacancies:
                        getValueOrNull(
                            "vacancies"
                        ),

                    qualification:
                        getValueOrNull(
                            "qualification"
                        ),

                    age_limit:
                        getValueOrNull(
                            "age_limit"
                        ),

                    salary:
                        getValueOrNull(
                            "salary"
                        ),

                    application_fee:
                        getValueOrNull(
                            "application_fee"
                        ),

                    start_date:
                        getValueOrNull(
                            "start_date"
                        ),

                    last_date:
                        getValueOrNull(
                            "last_date"
                        ),

                    exam_date:
                        getValueOrNull(
                            "exam_date"
                        ),

                    notification_url:
                        getValueOrNull(
                            "notification_url"
                        ),

                    apply_url:
                        getValueOrNull(
                            "apply_url"
                        ),

                    status:
                        document
                            .getElementById(
                                "status"
                            )
                            .value,

                    is_published:
                        document
